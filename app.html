<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>时痕 TimeTrace · 指标规则系统（解耦架构版）</title>
<meta name="description" content="时痕 TimeTrace · 分层架构：Domain / Repository / Service / State / UI 五层解耦，事件总线驱动。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;450;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     DESIGN TOKENS · 单一来源
     ============================================================ */
  :root{
    --paper:oklch(98% 0.010 85); --bg:oklch(96% 0.012 85); --bg-soft:oklch(94% 0.014 85);
    --ink:oklch(22% 0.018 235); --ink-soft:oklch(42% 0.012 235); --ink-faint:oklch(60% 0.010 235);
    --ink-ghost:oklch(76% 0.008 235);
    --line:oklch(89% 0.012 85); --line-soft:oklch(93% 0.008 85);
    --accent:oklch(44% 0.072 168); --accent-soft:oklch(94% 0.022 168);
    --accent-deep:oklch(30% 0.070 168); --gold:oklch(70% 0.105 75); --gold-soft:oklch(94% 0.030 80);
    --warm:oklch(60% 0.140 45); --danger:oklch(56% 0.150 25);
    --fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:19px;--fs-2xl:24px;--fs-3xl:32px;
    --sp-1:6px;--sp-2:10px;--sp-3:16px;--sp-4:24px;--sp-5:32px;--sp-6:48px;
    --r-s:6px;--r-m:10px;--r-l:14px;--r-xl:20px;
    --shadow-1:0 1px 0 oklch(22% 0.018 235 / .04), 0 4px 16px -10px oklch(22% 0.018 235 / .12);
    --shadow-2:0 1px 0 oklch(22% 0.018 235 / .05), 0 16px 40px -20px oklch(22% 0.018 235 / .25);
    --serif:"Noto Serif SC","Cormorant Garamond",serif;
    --sans:"Inter","Noto Serif SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --ease-out:cubic-bezier(.22, .61, .36, 1); --dur-1:.2s; --dur-2:.35s; --dur-3:.6s;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;}
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.55;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    background-image:radial-gradient(1100px 540px at 78% -8%,oklch(44% 0.072 168 / .07),transparent 60%),
      radial-gradient(820px 440px at -8% 28%,oklch(70% 0.105 75 / .06),transparent 60%);
    background-attachment:fixed;min-height:100vh;font-feature-settings:"ss01","cv11";}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent);color:var(--paper)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
  ::-webkit-scrollbar-thumb:hover{background:var(--ink-ghost)}
  button{font-family:inherit}

  /* App Shell */
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .sidebar{border-right:1px solid var(--line);background:oklch(97% 0.010 85 / .7);
    backdrop-filter:blur(12px);position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column;padding:20px 16px;}
  .brand{display:inline-flex;align-items:center;gap:10px;
    font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:24px;}
  .brand-mark{width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,oklch(85% 0.10 75),oklch(48% 0.10 70));
    box-shadow:inset 0 0 0 1px oklch(100% 0 0 / .5);}
  .brand-name em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;
    color:var(--ink-faint);font-weight:400;margin-left:6px;padding-left:6px;border-left:1px solid var(--line);}
  .nav-section{margin-top:18px}
  .nav-section .lbl{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;
    color:var(--ink-faint);text-transform:uppercase;padding:0 10px 6px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-m);
    font-size:var(--fs-md);color:var(--ink-soft);cursor:pointer;border:1px solid transparent;
    transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out);}
  .nav-item:hover{background:var(--bg-soft);color:var(--ink)}
  .nav-item.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .nav-item .ico{width:14px;height:14px;flex-shrink:0}
  .nav-item .badge{margin-left:auto;font-family:var(--mono);font-size:10px;
    padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);}
  .nav-item.active .badge{background:oklch(72% 0.105 75 / .3);color:oklch(94% 0.05 80)}
  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);}
  .sidebar-foot .stat{display:flex;justify-content:space-between;padding:3px 0}

  .main{min-width:0}
  .topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);
    background:oklch(96% 0.012 85 / .8);border-bottom:1px solid var(--line);
    padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .crumbs{font-family:var(--mono);font-size:12px;color:var(--ink-faint);letter-spacing:.4px;}
  .crumbs .sep{margin:0 8px;color:var(--ink-ghost)}
  .crumbs .cur{color:var(--ink)}
  .topbar-actions{display:flex;align-items:center;gap:8px}
  .view{padding:28px;display:none}
  .view.active{display:block;animation:view-in .45s var(--ease-out) both}
  @keyframes view-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* Components */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-m);
    font-size:var(--fs-md);font-weight:500;border:1px solid transparent;background:transparent;cursor:pointer;
    transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out),
      border-color var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out);}
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{background:var(--ink);color:var(--paper)}
  .btn-primary:hover{background:var(--accent-deep)}
  .btn-ghost{border-color:var(--line);color:var(--ink);background:var(--paper)}
  .btn-ghost:hover{border-color:var(--ink)}
  .btn-accent{background:var(--accent-soft);color:var(--accent-deep);border-color:oklch(44% 0.072 168 / .25)}
  .btn-accent:hover{background:var(--accent);color:var(--paper)}
  .btn-danger{color:var(--danger);border-color:oklch(56% 0.150 25 / .25);background:var(--paper)}
  .btn-danger:hover{background:var(--danger);color:var(--paper)}
  .btn-sm{padding:5px 10px;font-size:var(--fs-sm)}
  .btn-icon{padding:6px}
  input[type="text"],input[type="number"],input[type="date"],input[type="search"],select,textarea{
    width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-m);
    background:var(--paper);font-family:var(--sans);font-size:var(--fs-md);color:var(--ink);
    transition:border-color var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px oklch(44% 0.072 168 / .15)}
  textarea{font-family:var(--serif);font-size:var(--fs-lg);line-height:1.85;resize:vertical;min-height:140px}
  .label{display:block;font-size:var(--fs-xs);color:var(--ink-faint);margin-bottom:4px;letter-spacing:.4px;font-family:var(--mono);text-transform:uppercase}
  .field{margin-bottom:14px}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.3px;background:var(--accent-soft);color:var(--accent-deep);
    border:1px solid oklch(44% 0.072 168 / .15);}
  .badge.S{background:oklch(94% 0.030 80);color:oklch(38% 0.080 70);border-color:oklch(70% 0.105 75 / .25)}
  .badge.D{background:var(--accent-soft);color:var(--accent-deep);border-color:oklch(44% 0.072 168 / .18)}
  .badge.T{background:oklch(94% 0.018 280);color:oklch(38% 0.080 280);border-color:oklch(38% 0.080 280 / .18)}
  .badge.gold{background:var(--gold-soft);color:oklch(38% 0.080 70);border-color:oklch(70% 0.105 75 / .35)}
  .badge.ghost{background:transparent;color:var(--ink-faint);border-color:var(--line)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow-1);}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
  .card-head h3{margin:0;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .card-head .sub{font-size:var(--fs-xs);color:var(--ink-faint);letter-spacing:.3px;font-family:var(--mono)}
  .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat-tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;}
  .stat-tile .lbl{font-family:var(--mono);font-size:10px;letter-spacing:1.4px;color:var(--ink-faint);text-transform:uppercase}
  .stat-tile .v{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--ink);margin-top:6px;letter-spacing:-.5px}
  .stat-tile .v .unit{font-family:var(--mono);font-size:11px;color:var(--accent);margin-left:4px;font-weight:400}
  .stat-tile .delta{font-size:11px;color:var(--ink-faint);margin-top:4px}

  /* Rules */
  .rules-layout{display:grid;grid-template-columns:320px 1fr;gap:16px}
  .rules-list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;
    box-shadow:var(--shadow-1);max-height:calc(100vh - 200px);display:flex;flex-direction:column}
  .rules-list .head{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;background:oklch(96.5% 0.012 85)}
  .rules-list .head h4{margin:0;font-family:var(--serif);font-size:var(--fs-md);font-weight:600}
  .rules-list .body{flex:1;overflow-y:auto;padding:8px}
  .rule-row{padding:10px 12px;border-radius:var(--r-m);cursor:pointer;border:1px solid transparent;
    transition:background var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out);
    display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .rule-row:hover{background:var(--bg-soft)}
  .rule-row.active{background:var(--accent-soft);border-color:oklch(44% 0.072 168 / .25)}
  .rule-row .code{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11px;font-weight:600;background:var(--bg);color:var(--ink-soft)}
  .rule-row .meta{min-width:0}
  .rule-row .meta .name{font-family:var(--serif);font-size:var(--fs-md);font-weight:600;color:var(--ink)}
  .rule-row .meta .desc{font-size:11px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rule-row .weight{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .rule-row .weight b{color:var(--accent-deep)}
  .rules-detail{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:24px;box-shadow:var(--shadow-1)}
  .rules-detail .head-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
  .rules-detail h2{margin:0 0 4px;font-family:var(--serif);font-size:var(--fs-2xl);font-weight:600}
  .rules-detail .meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .rule-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .slider-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--line-soft);border-radius:999px;outline:none}
  input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 0 4px oklch(44% 0.072 168 / .18)}
  input[type="range"]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:none;
    box-shadow:0 0 0 4px oklch(44% 0.072 168 / .18)}
  .slider-val{font-family:var(--mono);font-size:var(--fs-md);color:var(--ink);font-weight:500;min-width:40px;text-align:right}
  .signal-tags{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--bg-soft);border-radius:var(--r-m);min-height:38px}
  .signal-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;
    background:var(--paper);border:1px solid var(--line);font-size:11px;color:var(--ink-soft);font-family:var(--mono)}
  .signal-tag .x{cursor:pointer;color:var(--ink-faint)}
  .signal-tag .x:hover{color:var(--danger)}
  .signal-input{border:none;background:transparent;padding:3px 6px;font-family:var(--mono);font-size:11px;min-width:80px;flex:1}
  .signal-input:focus{outline:none;box-shadow:none}
  .rules-tips{margin-top:16px;padding:12px 16px;background:var(--gold-soft);
    border:1px solid oklch(70% 0.105 75 / .3);border-radius:var(--r-m);
    font-size:var(--fs-sm);color:oklch(38% 0.08 70);line-height:1.7}

  /* Database */
  .db-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .db-toolbar .search{flex:1;min-width:220px;max-width:380px}
  .db-toolbar .filters{display:flex;gap:8px}
  .db-toolbar select{min-width:110px}
  .db-table-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow-1)}
  .db-table{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
  .db-table th{text-align:left;padding:12px 14px;background:oklch(96.5% 0.012 85);
    border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:1.2px;
    color:var(--ink-faint);text-transform:uppercase;font-weight:500}
  .db-table td{padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  .db-table tr:hover td{background:oklch(98% 0.010 85 / .5)}
  .db-table .date{font-family:var(--mono);font-size:var(--fs-sm);color:var(--ink-faint);white-space:nowrap}
  .db-table .text{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .db-table .actions{display:flex;gap:4px;justify-content:flex-end}
  .db-empty{padding:40px;text-align:center;color:var(--ink-faint);font-family:var(--serif);font-size:var(--fs-lg)}
  .db-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
    border-top:1px solid var(--line-soft);background:oklch(97% 0.010 85);font-size:var(--fs-sm);color:var(--ink-faint)}
  .db-footer .pages{display:flex;gap:4px}
  .page-btn{min-width:28px;height:28px;padding:0 8px;border:1px solid var(--line);background:var(--paper);
    border-radius:var(--r-s);font-family:var(--mono);font-size:12px;color:var(--ink-soft);cursor:pointer}
  .page-btn:hover{border-color:var(--ink);color:var(--ink)}
  .page-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .page-btn:disabled{opacity:.4;cursor:not-allowed}
  .db-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line-soft)}
  .db-tab{padding:8px 14px;cursor:pointer;font-family:var(--serif);font-size:var(--fs-md);color:var(--ink-soft);
    border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out)}
  .db-tab:hover{color:var(--ink)}
  .db-tab.active{color:var(--ink);border-bottom-color:var(--accent)}
  .db-tab .count{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:4px}

  /* Modal */
  .modal-back{position:fixed;inset:0;z-index:100;background:oklch(22% 0.018 235 / .35);
    backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px}
  .modal-back.open{display:flex;animation:fade .2s var(--ease-out) both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--paper);border-radius:var(--r-xl);width:100%;max-width:640px;
    max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-2);animation:pop .25s var(--ease-out) both}
  @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{margin:0;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .modal-body{padding:22px}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px;background:oklch(97% 0.010 85)}

  /* AI */
  .ai-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ai-journal,.ai-output{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:22px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:14px}
  .ai-journal textarea{min-height:280px;font-size:var(--fs-lg)}
  .ai-output h3{margin:0;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .ai-signals{display:grid;gap:6px}

  /* ===== AI 实时高亮预览 ===== */
  .ai-highlight{
    background:var(--bg);border:1px dashed var(--line);border-radius:var(--r-m);
    padding:12px 16px;min-height:60px;max-height:160px;overflow-y:auto;
    font-family:var(--serif);font-size:var(--fs-md);line-height:1.85;color:var(--ink);
    transition:border-color var(--dur-1) var(--ease-out);
  }
  .ai-highlight:empty,.ai-highlight .hint{display:block;color:var(--ink-faint);font-size:var(--fs-sm);font-family:var(--mono)}
  .ai-highlight .hl-D{background:oklch(88% 0.04 168);border-bottom:1.5px solid var(--accent);padding:1px 2px;border-radius:3px;color:var(--accent-deep)}
  .ai-highlight .hl-S{background:oklch(92% 0.04 80);border-bottom:1.5px solid oklch(70% 0.105 75);padding:1px 2px;border-radius:3px;color:oklch(38% 0.08 70)}
  .ai-highlight .hl-T{background:oklch(92% 0.025 280);border-bottom:1.5px solid oklch(50% 0.080 280);padding:1px 2px;border-radius:3px;color:oklch(38% 0.080 280)}
  .ai-highlight .hl-cat{
    display:inline-block;font-family:var(--mono);font-size:9px;color:var(--paper);
    background:var(--accent);padding:0 3px;border-radius:2px;margin-right:1px;vertical-align:middle;
  }
  .ai-highlight .hl-S .ai-cat{background:oklch(70% 0.105 75)}
  .ai-highlight .hl-T .ai-cat{background:oklch(50% 0.080 280)}
  .ai-signal{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
    padding:8px 12px;background:var(--bg-soft);border-radius:var(--r-m);font-size:var(--fs-md);color:var(--ink);
    border:1px solid transparent;animation:row-in .35s var(--ease-out) both}
  @keyframes row-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .ai-signal .src{font-family:var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ai-signal .conf{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
  .ai-signal .conf b{color:var(--accent-deep)}

  /* ===== 因子信息气泡 (Factor Tooltip) ===== */
  .factor-info{
    display:inline-flex;align-items:center;justify-content:center;
    width:14px;height:14px;border-radius:50%;
    background:var(--bg-soft);border:1px solid var(--line);
    color:var(--ink-faint);font-size:10px;font-weight:600;
    cursor:help;margin-left:6px;flex-shrink:0;
    transition:all var(--dur-1) var(--ease-out);
    font-family:var(--mono);
  }
  .factor-info:hover{background:var(--accent);color:var(--paper);border-color:var(--accent);transform:scale(1.15)}
  .factor-popover{
    position:absolute;z-index:250;
    width:280px;padding:14px 16px;
    background:var(--paper);border:1px solid var(--line);
    border-radius:var(--r-l);box-shadow:var(--shadow-2);
    font-size:var(--fs-sm);line-height:1.6;color:var(--ink);
    pointer-events:auto;opacity:0;transform:translateY(-4px);
    transition:opacity .2s var(--ease-out), transform .2s var(--ease-out);
  }
  .factor-popover.show{opacity:1;transform:none;pointer-events:auto}
  .factor-popover .pop-id{
    font-family:var(--mono);font-size:10px;letter-spacing:1.2px;
    color:var(--accent);margin-bottom:4px;
  }
  .factor-popover .pop-name{font-family:var(--serif);font-size:15px;font-weight:600;margin:0 0 6px;color:var(--ink)}
  .factor-popover .pop-desc{color:var(--ink-soft);font-size:12.5px;line-height:1.65;margin:0 0 10px}
  .factor-popover .pop-kws{
    display:flex;flex-wrap:wrap;gap:4px;
  }
  .factor-popover .pop-kws .kw{
    font-family:var(--mono);font-size:10px;padding:2px 6px;
    background:var(--bg-soft);border-radius:4px;color:var(--ink-soft);
  }
  .factor-popover .pop-intent{
    margin-top:8px;font-family:var(--mono);font-size:10px;
    color:var(--ink-faint);text-transform:uppercase;letter-spacing:1px;
  }
  .factor-popover .pop-intent.pos{color:var(--accent-deep)}
  .factor-popover .pop-intent.neg{color:var(--warm)}
  .factor-popover .pop-intent.neu{color:var(--ink-faint)}

  /* ===== AI 空态 & 无信号兜底 ===== */
  .ai-empty-state{
    margin-top:14px;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--r-m);
    background:var(--bg-soft);
  }
  .ai-empty-state .aes-title{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;color:var(--ink-faint);margin-bottom:10px;text-transform:uppercase}
  .ai-empty-state .aes-examples{display:grid;gap:8px}
  .ai-empty-state .aes-ex{
    text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-s);
    background:var(--paper);cursor:pointer;transition:all var(--dur-1) var(--ease-out);
    display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;
    font-family:var(--sans);font-size:13px;color:var(--ink-soft);line-height:1.55;
  }
  .ai-empty-state .aes-ex:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 14px -8px oklch(22% 0.018 235 / .2)}
  .ai-empty-state .aes-ex .tag{
    font-family:var(--mono);font-size:10px;letter-spacing:.8px;
    padding:3px 8px;border-radius:4px;color:var(--paper);font-weight:600;white-space:nowrap;
  }
  .ai-empty-state .aes-ex .tag.task{background:var(--accent)}
  .ai-empty-state .aes-ex .tag.explore{background:oklch(70% 0.105 75)}
  .ai-empty-state .aes-ex .tag.company{background:oklch(50% 0.080 280)}
  .ai-no-signal{
    margin-top:14px;padding:14px 16px;
    background:oklch(94% 0.030 50);border:1px solid oklch(70% 0.105 75 / .3);
    border-radius:var(--r-m);font-size:13px;color:var(--ink);
  }
  .ai-no-signal .ans-title{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;color:var(--warm);margin-bottom:6px;font-weight:600}
  .ai-no-signal .ans-body{color:var(--ink-soft);margin-bottom:8px}
  .ai-no-signal .ans-prompts{margin:0;padding-left:18px;color:var(--ink-soft);line-height:1.75}
  .ai-no-signal .ans-prompts b{color:var(--ink);font-weight:600}

  /* ===== v1.2 · 时间日历 ===== */
  .cal-header{
    display:flex;align-items:flex-end;justify-content:space-between;
    flex-wrap:wrap;gap:20px;margin-bottom:20px;padding-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .cal-legend{
    display:flex;align-items:center;gap:6px;
    font-family:var(--mono);font-size:11px;color:var(--ink-faint);
  }
  .lg-cell{
    display:inline-block;width:14px;height:14px;border-radius:3px;
    border:1px solid var(--line);
  }
  .lg-cell.l0{background:var(--bg-soft)}
  .lg-cell.l1{background:oklch(92% 0.030 168)}
  .lg-cell.l2{background:oklch(82% 0.075 168)}
  .lg-cell.l3{background:oklch(72% 0.115 168)}
  .lg-cell.l4{background:oklch(60% 0.150 168)}

  .cal-stats{
    display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;
  }
  .cal-stat{
    flex:1;min-width:140px;padding:14px 16px;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);
  }
  .cal-stat .lbl{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;color:var(--ink-faint);text-transform:uppercase;margin-bottom:6px}
  .cal-stat .v{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);line-height:1}
  .cal-stat .v .unit{font-size:13px;color:var(--ink-soft);margin-left:4px;font-weight:400}
  .cal-stat .delta{font-size:11px;color:var(--ink-soft);margin-top:6px;font-family:var(--mono)}
  .cal-stat.hot .v{color:var(--warm)}

  .cal-grid-wrap{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:20px;overflow-x:auto;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(10px, 1fr));
    gap:2px;
    max-width:100%;
    /* 53 weeks × 7 days as a 7-row grid via grid-auto-flow */
  }
  .cal-month-row{
    grid-column:1 / -1;
    display:grid;grid-template-columns:repeat(53, 1fr);
    font-family:var(--mono);font-size:9px;color:var(--ink-faint);
    margin-bottom:4px;height:14px;
  }
  .cal-month{
    text-align:left;
  }
  .cal-week-col{
    display:grid;grid-template-rows:repeat(7, 1fr);gap:2px;
  }
  .cal-cell{
    width:11px;height:11px;border-radius:2px;
    background:var(--bg-soft);border:1px solid var(--line);
    cursor:default;transition:all var(--dur-1) var(--ease-out);
    position:relative;
  }
  .cal-cell.empty{background:transparent;border-color:transparent}
  .cal-cell.l1{background:oklch(92% 0.030 168);border-color:oklch(86% 0.040 168)}
  .cal-cell.l2{background:oklch(82% 0.075 168);border-color:oklch(76% 0.085 168)}
  .cal-cell.l3{background:oklch(72% 0.115 168);border-color:oklch(66% 0.125 168)}
  .cal-cell.l4{background:oklch(60% 0.150 168);border-color:oklch(54% 0.150 168)}
  .cal-cell.clickable{cursor:pointer}
  .cal-cell.clickable:hover{
    transform:scale(1.6);z-index:5;
    box-shadow:0 4px 12px oklch(22% 0.018 235 / .25);
  }

  /* v1.2 · 因子贡献 chip */
  .contributors{
    margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;
  }
  .contributors.empty{color:var(--ink-faint);font-size:11px;font-style:italic}
  .contrib-chip{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 8px;background:var(--bg-soft);border:1px solid var(--line-soft);
    border-radius:999px;font-size:11px;color:var(--ink-soft);
  }
  .contrib-chip b{font-weight:600;color:var(--ink);font-family:var(--sans)}
  .contrib-chip .pct{font-family:var(--mono);color:var(--accent-deep);font-weight:600}
  .contrib-chip .factor-info{width:11px;height:11px;font-size:8px;margin-left:0}

  .cal-dayofweek{
    display:grid;grid-template-rows:repeat(7, 14px);gap:2px;
    font-family:var(--mono);font-size:10px;color:var(--ink-faint);
    margin-right:6px;
  }
  .cal-dayofweek span{height:11px;line-height:11px}

  .cal-day-detail{
    font-size:12px;color:var(--ink-soft);line-height:1.6;
  }
  .cal-day-detail .date{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .cal-day-detail .count{
    display:inline-block;padding:2px 8px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent-deep);
    font-family:var(--mono);font-size:11px;margin-right:6px;
  }
  .cal-day-detail ul{margin:8px 0;padding-left:18px}

  .cal-summary{
    margin-top:18px;padding:14px 16px;
    background:var(--bg-soft);border:1px solid var(--line-soft);
    border-radius:var(--r-m);font-size:13px;color:var(--ink-soft);line-height:1.7;
  }
  .cal-summary b{color:var(--ink);font-weight:600}

  /* 搜索模态框 */
  .search-modal-body{
    max-height:60vh;overflow-y:auto;padding:0;
  }
  .search-input-row{
    padding:14px 18px;border-bottom:1px solid var(--line-soft);
    position:sticky;top:0;background:var(--paper);z-index:1;
  }
  .search-input-row input{
    width:100%;padding:10px 14px;font-size:14px;border:1px solid var(--line);
    border-radius:var(--r-m);background:var(--bg-soft);color:var(--ink);
    font-family:var(--sans);
  }
  .search-input-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-results{padding:8px 0}
  .search-result{
    padding:12px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer;
    transition:background var(--dur-1) var(--ease-out);
  }
  .search-result:last-child{border-bottom:none}
  .search-result:hover{background:var(--accent-soft)}
  .search-result .date{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:4px}
  .search-result .snippet{font-size:13px;color:var(--ink);line-height:1.6}
  .search-result .snippet mark{background:oklch(92% 0.080 75);color:var(--ink);padding:1px 3px;border-radius:2px;font-weight:600}
  .search-result .factors{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
  .search-result .factors .badge{font-size:10px}
  .search-empty{padding:40px 18px;text-align:center;color:var(--ink-faint);font-size:13px}
  .search-counter{padding:8px 18px;font-family:var(--mono);font-size:10px;color:var(--ink-faint);border-bottom:1px solid var(--line-soft)}

  /* ===== 趋势条 (Workbench Trend) ===== */
  .wb-trend{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);
  }
  .wb-trend-item{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 8px;border-radius:999px;
    font-family:var(--mono);font-size:10px;letter-spacing:.5px;
    background:var(--bg-soft);color:var(--ink-soft);
  }
  .wb-trend-item .arr{font-size:11px;font-weight:700}
  .wb-trend-item.up{background:oklch(94% 0.022 168);color:var(--accent-deep)}
  .wb-trend-item.down{background:oklch(94% 0.030 50);color:var(--warm)}
  .wb-trend-item.flat{background:var(--bg-soft);color:var(--ink-faint)}
  .wb-trend-item .key{font-weight:600;color:var(--ink)}
  .ai-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ai-score{padding:14px;background:var(--bg-soft);border-radius:var(--r-m);text-align:center;border:1px solid var(--line)}
  .ai-score .k{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--ink-faint)}
  .ai-score .v{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);margin-top:4px}
  .ai-score.D .v{color:var(--accent-deep)}
  .ai-score.S .v{color:oklch(38% 0.080 70)}
  .ai-score.T .v{color:oklch(38% 0.080 280)}

  /* Workbench */
  .workbench-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
  .radar-card,.timeline-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:22px;box-shadow:var(--shadow-1)}
  .radar-card svg{width:100%;height:auto;display:block;overflow:visible;max-width:520px;margin:8px auto 0}
  .radar-card .period-tabs{display:inline-flex;padding:3px;gap:2px;background:var(--bg-soft);border:1px solid var(--line);border-radius:999px}
  .radar-card .period-tabs button{appearance:none;border:none;background:transparent;padding:5px 12px;border-radius:999px;
    font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);cursor:pointer;
    transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out)}
  .radar-card .period-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .timeline-card{display:flex;flex-direction:column;gap:14px}
  .timeline{display:grid;gap:8px}
  .timeline-day{display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:10px 12px;
    background:var(--bg-soft);border-radius:var(--r-m);align-items:center}
  .timeline-day .d{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
  .timeline-day .tx{font-family:var(--serif);font-size:var(--fs-md);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .timeline-day .tags{display:flex;gap:4px;flex-wrap:wrap}
  .timeline-day.empty{background:transparent;border:1px dashed var(--line);color:var(--ink-faint);font-style:italic}

  /* Import / Export */
  .ie-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ie-zone{background:var(--paper);border:2px dashed var(--line);border-radius:var(--r-l);padding:32px;
    text-align:center;transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out);cursor:pointer}
  .ie-zone:hover{border-color:var(--accent);background:oklch(94% 0.022 168 / .3)}
  .ie-zone.dragging{border-color:var(--accent);background:oklch(94% 0.022 168 / .5)}
  .ie-zone .glyph{font-size:32px;color:var(--accent);margin-bottom:8px}
  .ie-zone h4{margin:0 0 4px;font-family:var(--serif);font-size:var(--fs-lg);font-weight:600}
  .ie-zone p{font-size:var(--fs-sm);color:var(--ink-faint);margin:0}
  .ie-preview{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;box-shadow:var(--shadow-1);margin-top:16px}
  .ie-preview table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
  .ie-preview th{text-align:left;padding:8px 10px;background:var(--bg-soft);font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase}
  .ie-preview td{padding:8px 10px;border-bottom:1px solid var(--line-soft)}
  .ie-preview .map-select{padding:3px 6px;font-size:11px;font-family:var(--mono);border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper)}
  .ie-export-options{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:22px;box-shadow:var(--shadow-1)}
  .ie-format-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .ie-format{flex:1;min-width:180px;padding:16px;background:var(--bg-soft);border-radius:var(--r-m);
    border:1px solid var(--line);cursor:pointer;transition:border-color var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out)}
  .ie-format:hover{border-color:var(--accent)}
  .ie-format input{margin-right:8px;accent-color:var(--accent)}
  .ie-format .ttl{font-family:var(--serif);font-size:var(--fs-md);font-weight:600}
  .ie-format .sub{font-size:11px;color:var(--ink-faint);margin-top:2px;font-family:var(--mono)}

  /* Arch badges */
  .arch-banner{
    margin:0 0 20px;padding:10px 16px;border-radius:var(--r-m);
    background:linear-gradient(90deg, oklch(94% 0.022 168), oklch(94% 0.030 80));
    border:1px solid oklch(44% 0.072 168 / .2);
    font-size:var(--fs-sm);color:var(--ink-soft);display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .arch-banner code{font-family:var(--mono);font-size:11px;background:var(--paper);
    padding:2px 6px;border-radius:var(--r-s);border:1px solid var(--line);color:var(--ink)}
  .arch-banner b{color:var(--accent-deep)}

  /* Toast */
  .toast-stack{position:fixed;right:24px;bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
  .toast{padding:10px 16px;background:var(--ink);color:var(--paper);border-radius:var(--r-m);
    font-size:var(--fs-sm);box-shadow:var(--shadow-2);animation:toast-in .3s var(--ease-out) both,toast-out .3s var(--ease-out) 2.7s both}
  .toast.success{background:var(--accent-deep)}
  .toast.error{background:var(--danger)}
  @keyframes toast-in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
  @keyframes toast-out{to{opacity:0;transform:translateX(20px)}}

  /* ===== Accessibility · 焦点环 ===== */
  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-s)}
  button:focus-visible,a:focus-visible{outline-offset:3px}

  /* ===== Command Palette ===== */
  .cmdk-back{position:fixed;inset:0;z-index:300;background:oklch(22% 0.018 235 / .45);
    backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;
    padding-top:14vh}
  .cmdk-back.open{display:flex;animation:fade .2s var(--ease-out) both}
  .cmdk{
    width:min(640px,92vw);background:var(--paper);border-radius:var(--r-xl);
    box-shadow:0 30px 80px -20px oklch(22% 0.018 235 / .5);overflow:hidden;
    border:1px solid var(--line);animation:pop .25s var(--ease-out) both;
  }
  .cmdk-input{
    width:100%;padding:18px 20px;border:none;border-bottom:1px solid var(--line-soft);
    font-family:var(--serif);font-size:var(--fs-lg);background:transparent;color:var(--ink);
    outline:none;
  }
  .cmdk-list{max-height:48vh;overflow-y:auto;padding:8px}
  .cmdk-item{
    padding:10px 14px;border-radius:var(--r-m);cursor:pointer;
    display:flex;align-items:center;gap:12px;font-size:var(--fs-md);
    color:var(--ink);transition:background var(--dur-1) var(--ease-out);
  }
  .cmdk-item:hover,.cmdk-item.active{background:var(--accent-soft)}
  .cmdk-item .ic{width:18px;height:18px;color:var(--accent);flex-shrink:0}
  .cmdk-item .sc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-faint);
    background:var(--bg-soft);border:1px solid var(--line);padding:2px 6px;border-radius:var(--r-s)}
  .cmdk-empty{padding:24px;text-align:center;color:var(--ink-faint);font-size:var(--fs-sm)}
  .cmdk-foot{padding:10px 18px;border-top:1px solid var(--line-soft);background:oklch(97% 0.010 85);
    display:flex;gap:14px;font-size:11px;color:var(--ink-faint);font-family:var(--mono)}

  /* ===== Factor Breakdown ===== */
  .factor-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:22px;box-shadow:var(--shadow-1);margin-top:16px}
  .factor-card h3{margin:0 0 4px;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .factor-card .sub{font-size:var(--fs-xs);color:var(--ink-faint);font-family:var(--mono);margin-bottom:16px}
  .factor-dim{margin-bottom:18px}
  .factor-dim:last-child{margin-bottom:0}
  .factor-dim-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .factor-dim-head .lbl{font-family:var(--serif);font-size:var(--fs-md);font-weight:600;color:var(--ink)}
  .factor-dim-head .lbl .badge{vertical-align:middle;margin-right:6px;font-size:10px}
  .factor-dim-head .total{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .factor-bars{display:grid;gap:5px}
  .factor-bar-row{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;font-size:var(--fs-xs)}
  .factor-bar-row .nm{font-family:var(--serif);color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .factor-bar-row .nm .status-dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:6px;background:var(--ink-ghost)}
  .factor-bar-row .nm .status-dot.on{background:var(--accent)}
  .factor-bar-row .bar{height:5px;background:var(--line-soft);border-radius:999px;overflow:hidden}
  .factor-bar-row .bar > span{display:block;height:100%;border-radius:999px;background:var(--accent);
    transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease-out)}
  .factor-bar-row .bar.show > span{transform:scaleX(1)}
  .factor-bar-row .v{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);text-align:right}
  .factor-empty{padding:16px;text-align:center;color:var(--ink-faint);font-size:var(--fs-sm);background:var(--bg-soft);border-radius:var(--r-m)}

  /* ===== Derived Metrics (5 个观察指标) ===== */
  .derived-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
  .derived-tile{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:18px;box-shadow:var(--shadow-1);position:relative;overflow:hidden;
  }
  .derived-tile::before{
    content:"";position:absolute;left:0;top:0;height:3px;width:100%;
    background:var(--accent);opacity:.7;
  }
  .derived-tile .name{font-family:var(--serif);font-size:var(--fs-md);font-weight:600;color:var(--ink);margin:0 0 4px}
  .derived-tile .formula{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin:0 0 12px;letter-spacing:.3px}
  .derived-tile .v{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--ink);line-height:1;letter-spacing:-1px}
  .derived-tile .desc{font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.6}
  .derived-tile.hot::before{background:var(--warm)}
  .derived-tile.cool::before{background:var(--accent-deep)}

  /* ===== Time Pattern Heatmap ===== */
  .heatmap-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:22px;box-shadow:var(--shadow-1);margin-top:16px}
  .heatmap-card h3{margin:0 0 4px;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .heatmap-card .sub{font-size:var(--fs-xs);color:var(--ink-faint);font-family:var(--mono);margin-bottom:14px}
  .heatmap{display:grid;grid-template-columns:auto repeat(7,1fr);gap:3px;font-size:10px;font-family:var(--mono);color:var(--ink-soft)}
  .heatmap .h-label{display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:var(--ink-faint)}
  .heatmap .d-label{display:flex;align-items:center;justify-content:center;color:var(--ink-faint);padding:4px 0;font-size:10px}
  .heatmap .cell{
    aspect-ratio:1;border-radius:3px;background:var(--line-soft);position:relative;
    transition:transform .15s var(--ease-out);
  }
  .heatmap .cell:hover{transform:scale(1.2);z-index:2;box-shadow:0 4px 12px -4px oklch(22% 0.018 235 / .3)}
  .heatmap .cell.l1{background:oklch(88% 0.025 165)}
  .heatmap .cell.l2{background:oklch(80% 0.045 165)}
  .heatmap .cell.l3{background:oklch(72% 0.060 168)}
  .heatmap .cell.l4{background:oklch(60% 0.080 168)}
  .heatmap .cell.l5{background:oklch(46% 0.090 168)}
  .heatmap-legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
  .heatmap-legend .scale{display:flex;gap:2px}
  .heatmap-legend .scale span{width:14px;height:10px;border-radius:2px}

  /* ===== Correlation Matrix ===== */
  .corr-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:22px;box-shadow:var(--shadow-1);margin-top:16px}
  .corr-card h3{margin:0 0 4px;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .corr-card .sub{font-size:var(--fs-xs);color:var(--ink-faint);font-family:var(--mono);margin-bottom:14px}
  .corr-list{display:grid;gap:8px}
  .corr-row{
    display:grid;grid-template-columns:1fr auto 60px;gap:14px;align-items:center;
    padding:10px 14px;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-m);
    font-size:var(--fs-sm);
  }
  .corr-pair{display:flex;align-items:center;gap:8px}
  .corr-pair .badge{font-size:10.5px}
  .corr-pair .arr{color:var(--ink-faint);font-family:var(--mono)}
  .corr-arrow{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:999px}
  .corr-arrow.pos{background:oklch(94% 0.025 168);color:var(--accent-deep)}
  .corr-arrow.neg{background:oklch(94% 0.030 30);color:oklch(40% 0.140 30)}
  .corr-r{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}

  /* ===== Anomalies / Profile Type ===== */
  .anomaly-card,.type-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:22px;box-shadow:var(--shadow-1);margin-top:16px}
  .anomaly-card h3,.type-card h3{margin:0 0 14px;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .type-card .type-main{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:14px;background:var(--bg-soft);border-radius:var(--r-m)}
  .type-card .type-emoji{font-size:42px;line-height:1}
  .type-card .type-name{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink)}
  .type-card .type-conf{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:4px}
  .type-bars{display:grid;gap:8px}
  .type-bar-row{display:grid;grid-template-columns:120px 1fr 60px;align-items:center;gap:10px;font-size:var(--fs-sm)}
  .type-bar-row .nm{font-family:var(--serif);color:var(--ink);font-weight:500}
  .type-bar-row .bar{height:8px;background:var(--line-soft);border-radius:999px;overflow:hidden}
  .type-bar-row .bar > span{display:block;height:100%;border-radius:999px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform 1s var(--ease-out)}
  .type-bar-row .bar.show > span{transform:scaleX(1)}
  .type-bar-row .v{font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right;font-weight:500}
  .anomaly-list{display:grid;gap:8px}
  .anomaly-row{
    display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;
    padding:10px 14px;background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-m);
  }
  .anomaly-row .d{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .anomaly-row .tx{font-family:var(--serif);font-size:var(--fs-sm);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anomaly-row .dev{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--warm)}

  /* ===== Factor Heat Ranking ===== */
  .heat-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:22px;box-shadow:var(--shadow-1);margin-top:16px}
  .heat-card h3{margin:0 0 14px;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .heat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .heat-row{
    display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
    padding:8px 12px;background:var(--bg-soft);border-radius:var(--r-m);font-size:var(--fs-sm);
  }
  .heat-row .rank{font-family:var(--serif);font-size:var(--fs-md);font-weight:600;color:var(--accent-deep);width:24px}
  .heat-row .nm{font-family:var(--serif);color:var(--ink);font-weight:500}
  .heat-row .nm .badge{font-size:9.5px;margin-right:6px;vertical-align:middle}
  .heat-row .cnt{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);min-width:40px;text-align:right}

  /* ===== Skeleton Loading ===== */
  .skeleton{background:linear-gradient(90deg, oklch(93% 0.008 85) 0%, oklch(96% 0.010 85) 50%, oklch(93% 0.008 85) 100%);
    background-size:200% 100%;animation:skel 1.4s ease-in-out infinite;border-radius:var(--r-s)}
  @keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .skeleton-line{height:12px;margin-bottom:8px}
  .skeleton-line.lg{height:24px;width:60%}
  .skeleton-line.md{height:14px;width:80%}
  .skeleton-card{padding:18px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--paper);margin-bottom:12px}

  /* ===== Dark Mode ===== */
  [data-theme="dark"]{
    --paper: oklch(18% 0.012 235);
    --bg:    oklch(14% 0.014 235);
    --bg-soft: oklch(20% 0.014 235);
    --ink: oklch(94% 0.010 85);
    --ink-soft: oklch(75% 0.012 85);
    --ink-faint: oklch(58% 0.010 235);
    --ink-ghost: oklch(38% 0.008 235);
    --line: oklch(28% 0.014 235);
    --line-soft: oklch(24% 0.010 235);
    --accent-soft: oklch(28% 0.040 168);
    --gold-soft: oklch(28% 0.045 80);
    --shadow-1: 0 1px 0 oklch(0% 0 0 / .3), 0 8px 24px -10px oklch(0% 0 0 / .5);
    --shadow-2: 0 1px 0 oklch(0% 0 0 / .4), 0 24px 60px -28px oklch(0% 0 0 / .6);
  }
  [data-theme="dark"] body{
    background-image:
      radial-gradient(1100px 540px at 78% -8%, oklch(46% 0.072 168 / .15), transparent 60%),
      radial-gradient(820px 440px at -8% 28%, oklch(70% 0.105 75 / .08), transparent 60%);
  }
  [data-theme="dark"] .nav,
  [data-theme="dark"] .topbar{background:oklch(14% 0.014 235 / .85)}
  [data-theme="dark"] .sidebar{background:oklch(16% 0.014 235 / .85);border-right-color:oklch(28% 0.014 235)}
  .theme-toggle{
    background:transparent;border:1px solid var(--line);color:var(--ink-soft);
    padding:6px 10px;border-radius:999px;font-size:11px;cursor:pointer;
    font-family:var(--mono);display:inline-flex;align-items:center;gap:4px;
    transition:background var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out);
  }
  .theme-toggle:hover{background:var(--bg-soft);color:var(--ink)}

  /* ===== Onboarding overlay ===== */
  .onboard-back{position:fixed;inset:0;z-index:400;background:oklch(22% 0.018 235 / .55);
    backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:24px}
  .onboard-back.open{display:flex;animation:fade .3s var(--ease-out) both}
  .onboard{
    width:min(720px,94vw);background:var(--paper);border-radius:24px;
    box-shadow:var(--shadow-2);padding:36px 40px;position:relative;overflow:hidden;
    border:1px solid var(--line);
  }
  .onboard::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(600px 300px at 90% 0%, oklch(70% 0.105 75 / .12), transparent 60%);
  }
  .onboard-step{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;color:var(--accent);margin-bottom:8px}
  .onboard-title{font-family:var(--serif);font-size:32px;font-weight:600;color:var(--ink);margin:0 0 14px;line-height:1.2}
  .onboard-desc{font-size:15px;color:var(--ink-soft);line-height:1.8;margin:0 0 20px;max-width:560px}
  .onboard-list{display:grid;gap:10px;margin:0 0 24px}
  .onboard-item{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--ink-soft);line-height:1.7}
  .onboard-item .ic{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);
    display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600}
  .onboard-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
  .onboard-dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
  .onboard-dots .d{width:6px;height:6px;border-radius:50%;background:var(--line);transition:all .2s var(--ease-out)}
  .onboard-dots .d.on{background:var(--accent);width:18px;border-radius:999px}
  .onboard-skip{position:absolute;top:16px;right:20px;font-size:12px;color:var(--ink-faint);cursor:pointer;font-family:var(--mono)}
  .onboard-skip:hover{color:var(--ink)}

  /* ===== Help button (always visible) ===== */
  .help-btn{
    position:fixed;bottom:24px;right:24px;z-index:90;
    width:44px;height:44px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:18px;font-weight:600;
    box-shadow:var(--shadow-2);cursor:pointer;
    transition:transform var(--dur-1) var(--ease-out),background var(--dur-1) var(--ease-out);
  }
  .help-btn:hover{transform:scale(1.08);background:var(--accent-deep)}

  /* ===== Inline notification banner (soft toast) ===== */
  .inline-banner{
    padding:10px 14px;border-radius:var(--r-m);font-size:var(--fs-sm);
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
  }
  .inline-banner.tip{background:oklch(94% 0.025 168);color:var(--accent-deep);border:1px solid oklch(46% 0.080 168 / .2)}
  .inline-banner.warn{background:oklch(94% 0.030 80);color:oklch(40% 0.080 70);border:1px solid oklch(70% 0.105 75 / .3)}
  .inline-banner b{font-weight:600}

  /* ===== Stat tile variant (compact) ===== */
  .stat-tile.compact{padding:12px}
  .stat-tile.compact .v{font-size:20px;margin-top:4px}
  .stat-tile.compact .lbl{font-size:9.5px}

  /* ===== Hint text ===== */
  .hint{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono);letter-spacing:.3px;margin-top:6px}

  /* ===== Factors in Rules Editor ===== */
  .factor-editor{margin-top:14px}
  .factor-editor .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .factor-editor .head h5{margin:0;font-family:var(--serif);font-size:var(--fs-md);font-weight:600;color:var(--ink)}
  .factor-editor .head .count{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .factor-list{display:grid;gap:8px}
  .factor-row{
    padding:10px 12px;background:var(--bg-soft);border:1px solid var(--line);
    border-radius:var(--r-m);transition:border-color var(--dur-1) var(--ease-out),opacity var(--dur-1) var(--ease-out);
  }
  .factor-row:hover{border-color:var(--ink-ghost)}
  .factor-row.disabled{opacity:.5}
  .factor-row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .factor-row-top .left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .factor-row-top input[type="checkbox"]{accent-color:var(--accent)}
  .factor-row-top .nm{font-family:var(--serif);font-size:var(--fs-md);color:var(--ink);font-weight:500;background:transparent;border:none;padding:2px 4px;min-width:120px;flex:1}
  .factor-row-top .nm:focus{outline:none;box-shadow:none;border-bottom:1px solid var(--accent)}
  .factor-row-top .id{font-family:var(--mono);font-size:10px;color:var(--ink-faint);padding:2px 6px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s)}
  .factor-row-top .slider-row{display:grid;grid-template-columns:60px 1fr 36px;gap:6px;align-items:center;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .factor-row-top .slider-row input[type="range"]{height:3px}
  .factor-row-top .slider-row input[type="range"]::-webkit-slider-thumb{width:12px;height:12px;box-shadow:0 0 0 3px oklch(44% 0.072 168 / .15)}
  .factor-row-top .slider-val{min-width:28px;text-align:right;color:var(--ink);font-weight:500}
  .factor-row-top .actions{display:flex;gap:4px}
  .factor-row .desc-edit{width:100%;margin-top:6px;padding:4px 8px;font-size:11.5px;font-family:var(--sans);color:var(--ink-soft);
    background:transparent;border:1px dashed var(--line-soft);border-radius:var(--r-s);outline:none}
  .factor-row .desc-edit:focus{border-color:var(--accent);background:var(--paper)}
  .factor-row .signals-edit{width:100%;margin-top:6px;padding:6px 10px;font-size:11.5px;font-family:var(--mono);color:var(--ink-soft);
    background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);outline:none;min-height:30px}
  .factor-row .signals-edit:focus{border-color:var(--accent)}

  .factor-summary{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
    padding:12px 16px;background:var(--bg-soft);border:1px solid var(--line);
    border-radius:var(--r-m);margin-bottom:14px;
  }
  .factor-summary .item .lbl{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase}
  .factor-summary .item .v{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:600;margin-top:2px}

  /* ===== Trend Chart ===== */
  .trend-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:22px;box-shadow:var(--shadow-1);margin-top:16px}
  .trend-card h3{margin:0 0 14px;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .trend-svg{width:100%;height:220px;display:block}
  .trend-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;font-family:var(--mono);color:var(--ink-soft)}
  .trend-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

  /* ===== Distribution Bar ===== */
  .dist-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);
    padding:22px;box-shadow:var(--shadow-1);margin-top:16px}
  .dist-card h3{margin:0 0 14px;font-family:var(--serif);font-size:var(--fs-xl);font-weight:600}
  .dist-rows{display:grid;gap:8px}
  .dist-row{display:grid;grid-template-columns:140px 1fr 50px;align-items:center;gap:12px;font-size:var(--fs-sm)}
  .dist-row .lbl{font-family:var(--serif);color:var(--ink);font-weight:500}
  .dist-row .pct{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-align:right}
  .dist-row .bar{height:8px;background:var(--line-soft);border-radius:999px;overflow:hidden}
  .dist-row .bar > span{display:block;height:100%;border-radius:999px}

  /* ===== Empty State ===== */
  .empty-state{padding:48px 24px;text-align:center;color:var(--ink-faint)}
  .empty-state .glyph{font-size:48px;color:var(--ink-ghost);margin-bottom:12px}
  .empty-state h4{font-family:var(--serif);font-size:var(--fs-lg);color:var(--ink);margin:0 0 6px}
  .empty-state p{font-size:var(--fs-sm);margin:0 0 16px;line-height:1.7}

  /* ===== Selected Rows ===== */
  .db-table tr.selected td{background:oklch(94% 0.022 168 / .35)}
  .db-table .sel{width:28px}
  .db-table .sel input{accent-color:var(--accent)}
  .batch-bar{
    display:flex;align-items:center;gap:12px;padding:10px 16px;margin-bottom:12px;
    background:var(--accent-soft);border:1px solid oklch(44% 0.072 168 / .3);
    border-radius:var(--r-m);font-size:var(--fs-sm);color:var(--accent-deep);
    animation:fade .25s var(--ease-out) both;
  }
  .batch-bar .sel-count{font-family:var(--mono);font-weight:600}

  /* ===== Architecture Panel ===== */
  .arch-info{
    margin:0 0 20px;padding:0;background:var(--paper);border:1px solid var(--line);
    border-radius:var(--r-l);box-shadow:var(--shadow-1);overflow:hidden;
  }
  .arch-info summary{
    list-style:none;cursor:pointer;padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.4px;
  }
  .arch-info summary::-webkit-details-marker{display:none}
  .arch-info summary::after{content:'▾';transition:transform var(--dur-1) var(--ease-out)}
  .arch-info[open] summary::after{transform:rotate(180deg)}
  .arch-info .arch-body{padding:0 16px 16px;border-top:1px solid var(--line-soft)}
  .arch-layers{display:grid;gap:8px;margin-top:12px;font-family:var(--mono);font-size:11px}
  .arch-layer{padding:10px 12px;background:var(--bg-soft);border:1px solid var(--line);
    border-radius:var(--r-m);display:grid;grid-template-columns:60px 1fr 60px;gap:10px;align-items:center}
  .arch-layer .n{font-weight:600;color:var(--accent-deep)}
  .arch-layer .d{color:var(--ink-soft)}
  .arch-layer .r{font-family:var(--mono);font-size:10px;color:var(--ink-faint);text-align:right}

  /* ===== Backup Banner ===== */
  .backup-hint{
    margin:0 0 16px;padding:8px 14px;border-radius:var(--r-m);
    background:oklch(94% 0.030 80);border:1px solid oklch(70% 0.105 75 / .3);
    font-size:var(--fs-xs);color:oklch(38% 0.08 70);display:flex;align-items:center;gap:10px;
  }
  .backup-hint b{color:oklch(38% 0.08 50)}

  /* ===== Sortable Header ===== */
  .db-table th.sortable{cursor:pointer;user-select:none}
  .db-table th.sortable:hover{color:var(--ink)}
