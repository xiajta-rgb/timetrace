</style>
</head>
<body>

<!-- ============================================================
     APP SHELL · 由 JS 注入
     ============================================================ -->
<div id="app-root"></div>
<div class="modal-back" id="modal-back">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">编辑</h3><button class="btn btn-ghost btn-sm" id="modal-close">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="modal-cancel">取消</button><button class="btn btn-primary" id="modal-ok">保存</button></div>
  </div>
</div>
<div class="toast-stack" id="toasts"></div>

<script>
"use strict";

/* ============================================================
   LAYER 1 · DOMAIN LAYER
   - 实体定义（不可变结构）
   - 纯函数计算（无副作用，可在 Node 中测试）
   ============================================================ */
const Domain = (() => {

  // —— 实体工厂（构造带校验的对象）
  const createFactor = (data) => ({
    id: String(data.id || `F_${Date.now()}_${Math.random().toString(36).slice(2,4)}`),
    name: String(data.name || ''),
    desc: String(data.desc || ''),
    signals: Array.isArray(data.signals) ? data.signals.map(String) : [],
    weight: clamp(data.weight ?? 0.5, 0, 1),
    enabled: data.enabled !== false,
    // v1.1 字段
    negations: Array.isArray(data.negations) ? data.negations.map(String) : [],
    modifiers: Array.isArray(data.modifiers) ? data.modifiers.map(String) : [],
    intent: ['positive','negative','neutral'].includes(data.intent) ? data.intent : 'neutral'
  });

  const createMetricRule = (data) => Object.freeze({
    key: String(data.key),
    cat: ['D','S','T'].includes(data.cat) ? data.cat : 'D',
    name: String(data.name || ''),
    q: String(data.q || ''),
    desc: String(data.desc || ''),
    weight: clamp(data.weight, 0, 1),
    threshold: clamp(data.threshold, 0, 1),
    signals: Array.isArray(data.signals) ? data.signals.map(String) : [],
    factors: Array.isArray(data.factors) ? data.factors.map(f => Object.freeze(createFactor(f))) : []
  });

  const createEntry = (data) => Object.freeze({
    id: String(data.id || `e_${Date.now()}_${Math.random().toString(36).slice(2,6)}`),
    date: String(data.date || new Date().toISOString().slice(0,10)),
    text: String(data.text || ''),
    signals: Array.isArray(data.signals) ? data.signals : [],
    score: data.score && typeof data.score === 'object' ? {...data.score} : {},
    factorScores: data.factorScores && typeof data.factorScores === 'object' ? {...data.factorScores} : {},
    mood: ['positive','mixed','negative'].includes(data.mood) ? data.mood : 'mixed',
    scenario: String(data.scenario || '')
  });

  const createScenario = (data) => Object.freeze({
    id: String(data.id || `sc_${Date.now()}`),
    name: String(data.name || ''),
    emoji: String(data.emoji || ''),
    desc: String(data.desc || ''),
    stats: data.stats || {}
  });

  function clamp(n, min, max){ n = Number(n); if (isNaN(n)) return min; return Math.min(max, Math.max(min, n)); }

  // —— 纯函数：信号抽取（从 factors 中抽取 + 兼容老的 signals）
  // 输入：文本 + 规则列表
  // 输出：[{key, cat, src, factorId, factorName, weight}]
  // 在 text 中找所有 sig 出现的位置；返回 [{index, length, negated, modifier}]
  // v1.1 增强：1 字信号走精确；≥2 字信号先精确再宽松（looseMatch）
  // 精确匹配优先；宽松匹配作为补充（解决「开会」vs「开了一个会」）
  function findOccurrences(text, sig){
    const out = [];
    if (!sig || !text) return out;
    // 1) 精确匹配（substring）
    let from = 0;
    while (true){
      const idx = text.indexOf(sig, from);
      if (idx === -1) break;
      out.push({ index: idx, length: sig.length, kind:'exact' });
      from = idx + sig.length;
    }
    // 2) 宽松匹配（仅对 ≥2 字信号，避免漏掉「了/的/一/个」等被助词隔开的情况）
    if (sig.length >= 2){
      const loose = looseMatch(text, sig);
      loose.forEach(l => {
        // 去重：如果已经存在 exact 命中则跳过（exact 永远优先）
        const dup = out.some(o => o.index === l.index || (l.index >= o.index && l.index < o.index + o.length));
        if (!dup) out.push({ index: l.index, length: l.length, kind:'loose' });
      });
    }
    return out;
  }

  // 宽松匹配：当信号被助词（了/的/一/个/下）隔开时也能命中
  // 例如「开会」可匹配「开了一个会议」「开了个会」
  // 算法：sig 的每个字依次在 text 中按顺序出现，且总跨度 ≤ sig.length + maxGap
  // 返回 [{index, length}] 或 []
  function looseMatch(text, sig){
    const out = [];
    if (!sig || !text || sig.length < 2) return out;
    // 2 字信号允许 3 字间隔；3+ 字信号按比例放宽
    const maxGap = sig.length === 2 ? 3 : Math.min(sig.length + 1, 4);
    const maxSpan = sig.length + maxGap * (sig.length - 1);
    const first = sig[0];
    let from = 0;
    while (true){
      const startIdx = text.indexOf(first, from);
      if (startIdx === -1) break;
      // 从 startIdx 起依次找 sig[1..]
      let pos = startIdx;
      let ok = true;
      for (let j = 1; j < sig.length; j++){
        const next = text.indexOf(sig[j], pos + 1);
        if (next === -1 || next - startIdx > maxSpan){ ok = false; break; }
        pos = next;
      }
      if (ok){
        out.push({ index: startIdx, length: pos - startIdx + 1 });
      }
      from = startIdx + 1;
    }
    return out;
  }

  // 检测 sig 前 2 字符内是否有否定词 / 修饰符
  function inspectContext(text, idx){
    const start = Math.max(0, idx - 4); // 给"几乎不"等留 4 字符窗口
    const before = text.slice(start, idx);
    let negated = false;
    let modifier = 1.0;
    let negatedWord = null;
    let modifierWord = null;

    // 先匹配 modifier（按长度倒序）
    for (const m of DEFAULT_MODIFIERS){
      if (before.endsWith(m.word)){
        modifier = m.weight;
        modifierWord = m.word;
        break;
      }
    }

    // 再匹配 negation（看更长的窗口，避免"几乎不"被"不"抢匹配）
    for (const neg of DEFAULT_NEGATIONS){
      if (before.endsWith(neg)){
        negated = true;
        negatedWord = neg;
        break;
      }
    }

    return { negated, modifier, negatedWord, modifierWord };
  }

  // 抽取所有信号
  // v1.1 升级：支持否定识别 + 强度修饰符 + 置信度
  function extractSignals(text, rules){
    if (!text || !Array.isArray(rules)) return [];
    const hits = [];
    rules.forEach(r => {
      const hasFactors = Array.isArray(r.factors) && r.factors.length > 0;
      if (hasFactors){
        r.factors.forEach(f => {
          if (!f.enabled) return;
          const factorNegs = (f.negations && f.negations.length) ? f.negations : null;
          (f.signals || []).forEach(sig => {
            findOccurrences(text, sig).forEach(occ => {
              const ctx = inspectContext(text, occ.index);
              // 因子级否定词覆盖默认
              let negated = ctx.negated;
              let negatedWord = ctx.negatedWord;
              if (!negated && factorNegs){
                const start = Math.max(0, occ.index - 4);
                const before = text.slice(start, occ.index);
                for (const neg of factorNegs){
                  if (before.endsWith(neg)){
                    negated = true; negatedWord = neg; break;
                  }
                }
              }
              // 否定时给一个反向因子时翻转 intent（被否定后意义反转）
              // 中性 intent 不翻转
              const baseWeight = (f.weight || 0.5) * (r.weight || 1);
              const confidence = clamp(ctx.modifier, 0.2, 1.5);
              hits.push({
                key: r.key,
                cat: categoryOf(r.key),
                src: sig,
                factorId: f.id,
                factorName: f.name,
                weight: baseWeight * confidence,
                confidence,
                negated,
                negatedWord,
                modifierWord: ctx.modifierWord,
                intent: f.intent || 'neutral',
                _loc: occ.index,
                _len: occ.length
              });
            });
          });
        });
      } else {
        // 兼容老数据（无 factors 的情况）
        (r.signals || []).forEach(sig => {
          findOccurrences(text, sig).forEach(occ => {
            const ctx = inspectContext(text, occ.index);
            hits.push({
              key: r.key,
              cat: categoryOf(r.key),
              src: sig,
              factorId: null,
              factorName: null,
              weight: (r.weight || 1) * ctx.modifier,
              confidence: ctx.modifier,
              negated: ctx.negated,
              negatedWord: ctx.negatedWord,
              modifierWord: ctx.modifierWord,
              intent: 'neutral',
              _loc: occ.index,
              _len: occ.length
            });
          });
        });
      }
    });
    // 去重 v1.1：同因子 + 位置重叠/相邻视为同一事件，链式扩展合并
    // 用 Map 按范围 (loc|len) 索引，避免 list 中出现重复项
    const byFactor = new Map();
    hits.forEach(h => {
      const fk = h.factorId ? `${h.key}|${h.factorId}` : `${h.key}|_legacy_`;
      let rangeMap = byFactor.get(fk);
      if (!rangeMap){ rangeMap = new Map(); byFactor.set(fk, rangeMap); }
      // 链式合并
      const MAX_PASSES = rangeMap.size + 2;
      for (let pass = 0; pass < MAX_PASSES; pass++){
        let mergedThisPass = false;
        for (const [rKey, ex] of rangeMap.entries()){
          const hStart = h._loc, hEnd = h._loc + (h._len || h.src.length);
          const eStart = ex._loc, eEnd = ex._loc + (ex._len || ex.src.length);
          if (hStart <= eEnd && eStart <= hEnd){
            const newStart = Math.min(eStart, hStart);
            const newEnd = Math.max(eEnd, hEnd);
            if (newStart === eStart && newEnd === eEnd) continue;
            const winner = h.confidence > ex.confidence ? h : ex;
            const newKey = newStart + '|' + (newEnd - newStart);
            rangeMap.delete(rKey);
            rangeMap.set(newKey, { ...winner, _loc: newStart, _len: newEnd - newStart });
            h._loc = newStart; h._len = newEnd - newStart;
            mergedThisPass = true;
            break;
          }
        }
        if (!mergedThisPass) break;
      }
      // 加入 h（最终位置），但若 h 完全被某个已有 hit 包含则跳过
      let isContained = false;
      const hStart = h._loc, hEnd = h._loc + (h._len || h.src.length);
      for (const [, ex] of rangeMap.entries()){
        const eStart = ex._loc, eEnd = ex._loc + (ex._len || ex.src.length);
        if (eStart <= hStart && hEnd <= eEnd){
          isContained = true; break;
        }
      }
      if (!isContained){
        const hKey = h._loc + '|' + (h._len || h.src.length);
        if (!rangeMap.has(hKey)){
          rangeMap.set(hKey, h);
        }
      }
    });
    return Array.from(byFactor.values()).map(m => Array.from(m.values())).flat();
  }

  function categoryOf(key){ return (key || '').replace(/[0-9]/g,''); }

  // —— 纯函数：评分（增强版 · 含因子分）
  // v1.1：使用 confidence 调制；否定 + 负向 intent → 翻转为正向分（"没有焦虑"是好事）
  function scoreFromSignals(signals, rules){
    const dimScores = {};     // 累加 confidence
    const factorScores = {};
    const dimNegate = {};     // 累加否定数（用于 dim 维度反向）
    const factorNegate = {};
    rules.forEach(r => {
      dimScores[r.key] = 0;
      dimNegate[r.key] = 0;
      if (Array.isArray(r.factors)){
        r.factors.forEach(f => {
          factorScores[f.id] = 0;
          factorNegate[f.id] = 0;
        });
      }
    });
    signals.forEach(s => {
      const conf = (typeof s.confidence === 'number') ? s.confidence : 1;
      const w = (typeof s.weight === 'number') ? s.weight : 0.5;
      const contribution = conf * w;
      if (dimScores[s.key] !== undefined) dimScores[s.key] += contribution;
      if (s.factorId && factorScores[s.factorId] !== undefined){
        factorScores[s.factorId] += contribution;
        // 负向 intent + 否定 → 视为"良好信号"（不扣分）
        if (s.negated && s.intent === 'negative'){
          factorNegate[s.factorId] += contribution;
        }
      }
      if (s.negated) dimNegate[s.key] = (dimNegate[s.key] || 0) + contribution;
    });
    // 维度总能量 = 命中贡献总和（0-10）
    const maxDim = Math.max(1, ...Object.values(dimScores));
    const dimScore = {};
    const factorScore = {};
    rules.forEach(r => {
      const w = r.weight || 1;
      dimScore[r.key] = clamp((dimScores[r.key] / maxDim) * 10 * (w + 0.2), 0, 10);
      if (Array.isArray(r.factors)){
        r.factors.forEach(f => {
          if (!f.enabled){ factorScore[f.id] = 0; return; }
          const base = clamp((factorScores[f.id] / maxDim) * 10 * (f.weight || 0.5) * (w + 0.2), 0, 10);
          // 负向 intent 因子的命中若被否定，按 (factorNegate / factorScores) 比例回扣
          if (f.intent === 'negative' && factorScores[f.id] > 0){
            const positive = factorScores[f.id] - factorNegate[f.id];
            const ratio = Math.max(0, positive) / factorScores[f.id];
            factorScore[f.id] = clamp(base * ratio, 0, 10);
          } else {
            factorScore[f.id] = base;
          }
        });
      }
    });
    return { dimScore, factorScore, _confidences: dimScores };
  }

  // —— 纯函数：从日记派生事件
  function deriveEvents(entries){
    const map = new Map();
    entries.forEach(e => {
      (e.signals || []).forEach(s => {
        if (s.cat !== 'D') return;
        if (!s.key.startsWith('D3')) return;
        const cur = map.get(s.src) || { src:s.src, count:0, dates:[] };
        cur.count++; cur.dates.push(e.date);
        map.set(s.src, cur);
      });
    });
    return Array.from(map.values());
  }

  // —— 纯函数：去极值平均（trimmed mean）
  // 移除上下各 trimRatio（默认 10%）后再求平均，对离群值更稳健
  function trimmedMean(values, trimRatio){
    if (!values.length) return 0;
    const ratio = trimRatio == null ? 0.1 : trimRatio;
    const sorted = values.slice().sort((a,b) => a-b);
    const trim = Math.floor(sorted.length * ratio);
    const trimmed = trim > 0 ? sorted.slice(trim, sorted.length - trim) : sorted;
    if (trimmed.length === 0) return sorted[Math.floor(sorted.length/2)];
    return trimmed.reduce((s,v) => s+v, 0) / trimmed.length;
  }

  // —— 纯函数：聚合画像（v1.1 · 加去极值 + 趋势对比）
  // period: '7' | '30' | '90' | 'all' | 自定义天数
  // 返回中多带 prevPeriod 字段，与 period 紧邻的前 N 天聚合，可直接对比
  function aggregateProfile(entries, rules, period){
    let filtered = entries;
    let prevFiltered = [];
    if (period && period !== 'all'){
      const days = Number(period);
      if (!isNaN(days)){
        const sorted = entries.slice().sort((a,b) => b.date.localeCompare(a.date));
        if (sorted.length){
          const latest = new Date(sorted[0].date).getTime();
          const cutoff = latest - days * 86400000;
          const prevCutoff = cutoff - days * 86400000;
          filtered = entries.filter(e => {
            const t = new Date(e.date).getTime();
            return t <= latest && t >= cutoff;
          });
          prevFiltered = entries.filter(e => {
            const t = new Date(e.date).getTime();
            return t < cutoff && t >= prevCutoff;
          });
        }
      }
    }
    // 简单聚合（带去极值）
    const aggregate = (arr) => {
      const dimVals = {}; const factorVals = {};
      rules.forEach(r => {
        dimVals[r.key] = [];
        if (Array.isArray(r.factors)) r.factors.forEach(f => { factorVals[f.id] = []; });
      });
      arr.forEach(e => {
        rules.forEach(r => {
          const v = e.score && typeof e.score[r.key] === 'number' ? e.score[r.key] : null;
          if (v !== null) dimVals[r.key].push(v);
          if (Array.isArray(r.factors) && e.factorScores){
            r.factors.forEach(f => {
              const fv = e.factorScores[f.id];
              if (typeof fv === 'number') factorVals[f.id].push(fv);
            });
          }
        });
      });
      const dimAgg = {}; const factorAgg = {};
      rules.forEach(r => {
        dimAgg[r.key] = trimmedMean(dimVals[r.key], 0.1);
        if (Array.isArray(r.factors)){
          r.factors.forEach(f => {
            factorAgg[f.id] = trimmedMean(factorVals[f.id], 0.1);
          });
        }
      });
      return { dimAgg, factorAgg };
    };
    const cur = aggregate(filtered);
    const prev = prevFiltered.length ? aggregate(prevFiltered) : null;
    const trend = {};
    if (prev){
      rules.forEach(r => {
        const curV = cur.dimAgg[r.key] || 0;
        const prevV = prev.dimAgg[r.key] || 0;
        trend[r.key] = {
          current: curV,
          previous: prevV,
          delta: curV - prevV,
          direction: curV - prevV > 0.5 ? 'up' : (curV - prevV < -0.5 ? 'down' : 'flat')
        };
      });
    }
    return {
      dimAggregation: cur.dimAgg,
      factorAggregation: cur.factorAgg,
      sampleSize: filtered.length,
      period,
      prevPeriod: prev ? { sampleSize: prevFiltered.length, dimAggregation: prev.dimAgg } : null,
      trend
    };
  }

  // —— 纯函数：扁平化所有因子（用于全量搜索/统计）
  function flattenFactors(rules){
    const out = [];
    rules.forEach(r => {
      (r.factors || []).forEach(f => {
        out.push({ ...f, dimKey:r.key, dimName:r.name, cat:r.cat });
      });
    });
    return out;
  }

  // ============================================================
  // 5 个派生观察指标（原文中的核心算法）
  // ============================================================

  // ① 时间压缩度 · D2 + D3 + T1（越高 = 时间越容易被压缩成模糊的"过去"）
  // 算法：高重复 + 低新事件 + 低体验痕迹 = 高压缩
  function deriveTimeCompression(dimAgg){
    const D2 = dimAgg.D2 || 0;
    const D3 = dimAgg.D3 || 0;
    const T1 = dimAgg.T1 || 0;
    // 0-10 分
    return clamp(D2 * 0.4 + (10 - D3) * 0.3 + (10 - T1) * 0.3, 0, 10);
  }

  // ② 体验密度 · D3 + T1（越高 = 单位时间内体验节点越多）
  function deriveExperienceDensity(dimAgg){
    return clamp((dimAgg.D3 || 0) * 0.5 + (dimAgg.T1 || 0) * 0.5, 0, 10);
  }

  // ③ 结果化程度 · S1 + S2（越高 = 生活越被目标和结果牵引）
  function deriveResultOrientation(dimAgg){
    return clamp((dimAgg.S1 || 0) * 0.5 + (dimAgg.S2 || 0) * 0.5, 0, 10);
  }

  // ④ 生命参与度 · S3 + T1 + T2（越高 = 真正参与了正在发生的事）
  function deriveLifeParticipation(dimAgg){
    return clamp((dimAgg.S3 || 0) * 0.35 + (dimAgg.T1 || 0) * 0.3 + (dimAgg.T2 || 0) * 0.35, 0, 10);
  }

  // ⑤ 时间留痕度 · T1 + T2 + T3（越高 = 过去的时间在记忆/认知/关系里留下越多东西）
  function deriveTimeTrace(dimAgg){
    return clamp((dimAgg.T1 || 0) * 0.3 + (dimAgg.T2 || 0) * 0.35 + (dimAgg.T3 || 0) * 0.35, 0, 10);
  }

  // 综合 5 个观察指标
  function deriveAllObservations(dimAgg){
    return {
      timeCompression: deriveTimeCompression(dimAgg),
      experienceDensity: deriveExperienceDensity(dimAgg),
      resultOrientation: deriveResultOrientation(dimAgg),
      lifeParticipation: deriveLifeParticipation(dimAgg),
      timeTrace: deriveTimeTrace(dimAgg)
    };
  }

  // ============================================================
  // 时间模式分析
  // ============================================================

  // 周 × 日 分布热力图（7 维 × N 维）
  // 输入：entries，输出：[{dayOfWeek, weekIdx, count, score}]
  function analyzeTimePattern(entries){
    if (!entries.length) return { heatmap:[], weekdayAverages:[], peakDay:null, peakTime:null };

    // 按 (周几, 第几周) 分组
    const heatmap = []; // {dow, weekIdx, count, avgScore}
    const dowTotals = [0,0,0,0,0,0,0];
    const dowCounts = [0,0,0,0,0,0,0];

    // 计算最早日期作为基准周
    const sorted = entries.slice().sort((a,b) => a.date.localeCompare(b.date));
    const firstDate = new Date(sorted[0].date);
    const baseTime = firstDate.getTime();

    sorted.forEach(e => {
      const d = new Date(e.date);
      const dow = d.getDay(); // 0=Sun
      const weekIdx = Math.floor((d.getTime() - baseTime) / (7 * 86400000));
      const dayScore = e.score ? Object.values(e.score).reduce((s,v) => s+v, 0) / 9 : 0;

      let cell = heatmap.find(h => h.dow === dow && h.weekIdx === weekIdx);
      if (!cell){ cell = { dow, weekIdx, count:0, scoreSum:0 }; heatmap.push(cell); }
      cell.count++; cell.scoreSum += dayScore;

      dowTotals[dow] += dayScore;
      dowCounts[dow]++;
    });

    // 周内平均
    const weekdayAverages = dowTotals.map((t, i) => dowCounts[i] ? t / dowCounts[i] : 0);
    const peakDay = weekdayAverages.indexOf(Math.max(...weekdayAverages));
    const dayNames = ['日','一','二','三','四','五','六'];

    // 简单周期性：对比相邻两天相似度
    let similarPairs = 0;
    for (let i = 0; i < 6; i++){
      if (Math.abs(weekdayAverages[i] - weekdayAverages[i+1]) < 1) similarPairs++;
    }
    const periodicity = similarPairs / 6; // 0-1，越高越周期化

    return { heatmap, weekdayAverages, peakDay, peakDayLabel:'周'+dayNames[peakDay], periodicity };
  }

  // ============================================================
  // 跨维度相关性（皮尔逊相关系数）
  // ============================================================
  function correlateDimensions(entries){
    if (entries.length < 3) return [];
    const dims = ['D1','D2','D3','S1','S2','S3','T1','T2','T3'];
    const series = {};
    dims.forEach(d => series[d] = entries.map(e => (e.score && e.score[d]) || 0));

    const result = [];
    for (let i = 0; i < dims.length; i++){
      for (let j = i + 1; j < dims.length; j++){
        const a = series[dims[i]], b = series[dims[j]];
        const r = pearson(a, b);
        if (Math.abs(r) >= 0.5) result.push({ a:dims[i], b:dims[j], r: parseFloat(r.toFixed(2)) });
      }
    }
    return result.sort((x,y) => Math.abs(y.r) - Math.abs(x.r));
  }
  function pearson(a, b){
    const n = a.length;
    if (n !== b.length || n === 0) return 0;
    const ma = a.reduce((s,v) => s+v, 0) / n;
    const mb = b.reduce((s,v) => s+v, 0) / n;
    let num = 0, da = 0, db = 0;
    for (let i = 0; i < n; i++){
      const x = a[i] - ma, y = b[i] - mb;
      num += x * y; da += x * x; db += y * y;
    }
    const den = Math.sqrt(da * db);
    return den === 0 ? 0 : num / den;
  }

  // ============================================================
  // 异常日记检测（与画像显著不同的日子）
  // ============================================================
  function detectAnomalies(entries, dimAgg){
    if (entries.length < 5) return [];
    const dims = ['D1','D2','D3','S1','S2','S3','T1','T2','T3'];
    const anomalies = [];
    entries.forEach(e => {
      if (!e.score) return;
      let totalDev = 0;
      dims.forEach(d => {
        const v = e.score[d] || 0;
        const avg = dimAgg[d] || 0;
        totalDev += Math.abs(v - avg);
      });
      const devScore = totalDev / dims.length;
      if (devScore > 2.5){
        anomalies.push({ entry:e, devScore: parseFloat(devScore.toFixed(2)) });
      }
    });
    return anomalies.sort((a,b) => b.devScore - a.devScore).slice(0, 5);
  }

  // ============================================================
  // 画像结构识别（自动判断属于哪种典型类型）
  // ============================================================
  function classifyProfileStructure(dimAgg){
    // 三种典型：任务化 / 探索 / 稳定陪伴
    const taskScore = (dimAgg.D2 || 0) * 0.3 + (dimAgg.S1 || 0) * 0.25 + (dimAgg.S2 || 0) * 0.25 + (10 - (dimAgg.D3 || 0)) * 0.2;
    const exploreScore = (dimAgg.D3 || 0) * 0.3 + (dimAgg.T2 || 0) * 0.3 + (dimAgg.S3 || 0) * 0.2 + (10 - (dimAgg.D2 || 0)) * 0.2;
    const stableScore = (dimAgg.T1 || 0) * 0.25 + (dimAgg.T3 || 0) * 0.35 + (10 - (dimAgg.S1 || 0)) * 0.2 + (10 - (dimAgg.S2 || 0)) * 0.2;

    const types = [
      { name:'任务化', score: taskScore, emoji:'📅' },
      { name:'探索型', score: exploreScore, emoji:'🧭' },
      { name:'稳定陪伴', score: stableScore, emoji:'🌿' }
    ].sort((a,b) => b.score - a.score);

    return {
      primary: types[0],
      scores: types,
      confidence: parseFloat(Math.min(100, (types[0].score / Math.max(types[1].score, 0.1)) * 50).toFixed(0))
    };
  }

  // ============================================================
  // 因子热度排行（哪 N 个因子被触发最多）
  // ============================================================
  function rankFactorHeat(entries, rules){
    const counts = {};
    rules.forEach(r => (r.factors || []).forEach(f => { counts[f.id] = { id:f.id, name:f.name, cat:r.cat, dim:r.key, dimName:r.name, count:0 }; }));
    entries.forEach(e => (e.signals || []).forEach(s => {
      if (s.factorId && counts[s.factorId]) counts[s.factorId].count++;
    }));
    return Object.values(counts).sort((a,b) => b.count - a.count).filter(f => f.count > 0);
  }

  // ============================================================
  // v1.2 新增：每日连续记录 Streak
  // ============================================================
  function computeStreak(entries, today){
    today = today || new Date().toISOString().slice(0,10);
    if (!entries || entries.length === 0){
      return { current:0, longest:0, lastDate:null, totalDays:0, todayDone:false };
    }
    // 收集有日记的所有日期
    const dateSet = new Set();
    entries.forEach(e => { if (e.date) dateSet.add(e.date); });
    const sortedDates = Array.from(dateSet).sort();
    const totalDays = dateSet.size;
    const lastDate = sortedDates[sortedDates.length - 1];

    // 计算最长连续（按天连续）
    let longest = 1;
    let curRun = 1;
    for (let i = 1; i < sortedDates.length; i++){
      const prev = new Date(sortedDates[i-1]);
      const cur = new Date(sortedDates[i]);
      const diff = Math.round((cur - prev) / 86400000);
      if (diff === 1){
        curRun++;
        if (curRun > longest) longest = curRun;
      } else {
        curRun = 1;
      }
    }

    // 计算当前连续（从 today 或 lastDate 往前数）
    const todayDone = dateSet.has(today);
    const todayMs = new Date(today).getTime();
    const yesterday = new Date(todayMs - 86400000).toISOString().slice(0,10);
    const yesterdayDone = dateSet.has(yesterday);

    let current = 0;
    if (todayDone || yesterdayDone){
      // 从今天（或昨天）开始往前数
      let cursor = new Date(todayDone ? today : yesterday);
      while (dateSet.has(cursor.toISOString().slice(0,10))){
        current++;
        cursor = new Date(cursor.getTime() - 86400000);
      }
    }

    return { current, longest, lastDate, totalDays, todayDone };
  }

  // ============================================================
  // v1.2 新增：因子贡献者（为什么这个维度分数高/低）
  // ============================================================
  // 返回 top N 因子对该维度的贡献（正负）
  function deriveFactorContributions(dimKey, factorAgg, rules, topN){
    topN = topN || 3;
    if (!factorAgg || !rules) return [];
    const dimRule = rules.find(r => r.key === dimKey);
    if (!dimRule) return [];
    const dimScore = factorAgg._dimScores ? factorAgg._dimScores[dimKey] : null;
    // 计算每个 enabled 因子的加权贡献
    const items = [];
    (dimRule.factors || []).forEach(f => {
      if (!f.enabled) return;
      const v = factorAgg[f.id] || 0;
      // 贡献 = 因子值 × 因子权重 × 维度权重
      const contribution = v * (f.weight || 0.5) * (dimRule.weight || 1);
      if (contribution > 0.01){
        items.push({
          factorId: f.id,
          factorName: f.name,
          value: v,
          weight: f.weight || 0.5,
          contribution,
          intent: f.intent || 'neutral',
          sign: contribution >= 0 ? 'pos' : 'neg'
        });
      }
    });
    items.sort((a,b) => b.contribution - a.contribution);
    // 归一化为百分比
    const totalContrib = items.reduce((s, x) => s + x.contribution, 0);
    if (totalContrib > 0){
      items.forEach(it => { it.share = parseFloat((it.contribution / totalContrib * 100).toFixed(1)); });
    }
    return items.slice(0, topN);
  }

  // ============================================================
  // v1.2 新增：日历热力图数据
  // ============================================================
  // 返回按周分组的二维数组，每格 { date, count, intensity(0-4) }
  function buildCalendarData(entries, weeks){
    weeks = weeks || 53;
    const todayMs = Date.now();
    const startMs = todayMs - weeks * 7 * 86400000;
    // 对齐到周日
    const startDate = new Date(startMs);
    startDate.setHours(0,0,0,0);
    // 找最近的周日（dow 0 = Sun）
    const startDow = startDate.getDay();
    startDate.setDate(startDate.getDate() - startDow);

    // 收集每天的条目数和信号数
    const dayData = {};
    entries.forEach(e => {
      if (!e.date) return;
      if (!dayData[e.date]) dayData[e.date] = { count:0, signals:0 };
      dayData[e.date].count++;
      dayData[e.date].signals += (e.signals || []).length;
    });

    // 生成 weeks × 7 网格
    const grid = [];
    const today = new Date();
    today.setHours(0,0,0,0);
    for (let w = 0; w < weeks; w++){
      const week = [];
      for (let d = 0; d < 7; d++){
        const cellDate = new Date(startDate);
        cellDate.setDate(cellDate.getDate() + w * 7 + d);
        if (cellDate > today){
          // 未来日期：留空
          week.push({ date:null, count:0, signals:0, intensity:-1 });
          continue;
        }
        const dateStr = cellDate.toISOString().slice(0,10);
        const data = dayData[dateStr] || { count:0, signals:0 };
        // intensity 0-4 基于信号数
        let intensity = 0;
        if (data.signals >= 1) intensity = 1;
        if (data.signals >= 5) intensity = 2;
        if (data.signals >= 10) intensity = 3;
        if (data.signals >= 15) intensity = 4;
        week.push({ date:dateStr, count:data.count, signals:data.signals, intensity });
      }
      grid.push(week);
    }
    return grid;
  }

  // ============================================================
  // v1.2 新增：条目搜索
  // ============================================================
  function searchEntries(entries, query){
    if (!query || !query.trim() || !Array.isArray(entries)) return [];
    const q = query.trim().toLowerCase();
    const results = [];
    entries.forEach(e => {
      const text = (e.text || '').toLowerCase();
      const idx = text.indexOf(q);
      if (idx >= 0){
        // 提取上下文片段（前 20 + 命中 + 后 20）
        const start = Math.max(0, idx - 20);
        const end = Math.min(text.length, idx + q.length + 20);
        const snippet = (start > 0 ? '…' : '') + (e.text || '').slice(start, end) + (end < e.text.length ? '…' : '');
        results.push({
          entry: e,
          matchIndex: idx,
          matchLength: q.length,
          snippet,
          // 命中的因子（如果该 entry 有 signals）
          factors: (e.signals || []).slice(0, 3).map(s => s.factorName).filter(Boolean)
        });
      }
    });
    // 按日期倒序
    results.sort((a,b) => (b.entry.date || '').localeCompare(a.entry.date || ''));
    return results;
  }

  // ============================================================
  // Schema 版本与数据迁移
  // ============================================================
  // v1.1 新增：
  //   1) 因子增加 desc（情绪切点）、negations（否定词集）、modifiers（强度集）、intent（'positive'|'negative'|'neutral'）
  //   2) extractSignals 支持否定识别与强度调制
  //   3) 信号对象新增 confidence 字段（0..1.5）
  const SCHEMA_VERSION = '1.1';

  // 否定词：出现在信号词前 2 字符内的前缀，会取消或反转命中
  // 注意：JS 的 endsWith 按 UTF-16 code unit 比较（中文 BMP 每字 1 unit）
  // 这里列出从长到短的所有常见否定前缀，确保长前缀优先匹配
  const DEFAULT_NEGATIONS = ['不再','不是','不太','从不','从未','绝不','几乎不','永不','不卷','没','未','无','不','别'];

  // 强度修饰符：出现在信号词前 2 字符内的前缀，调整置信度
  // key 越长优先级越高（先匹配长前缀）
  const DEFAULT_MODIFIERS = [
    { word:'极其',  weight:1.5 },
    { word:'非常',  weight:1.4 },
    { word:'特别',  weight:1.3 },
    { word:'很',    weight:1.2 },
    { word:'比较',  weight:1.1 },
    { word:'稍微',  weight:0.8 },
    { word:'有点',  weight:0.7 },
    { word:'几乎',  weight:0.5 },
    { word:'几乎不', weight:0.3 },
  ];

  // 迁移器：从任意旧版本迁移到当前版本
  const MIGRATIONS = {
    '0.9->1.0': function(data){
      return { ...data, _migratedFrom: '0.9' };
    },
    '1.0->1.1': function(data){
      // 为旧因子补齐 v1.1 新字段
      const ensure = f => ({
        ...f,
        desc: f.desc || '',
        negations: Array.isArray(f.negations) ? f.negations : [],
        modifiers: Array.isArray(f.modifiers) ? f.modifiers : [],
        intent: f.intent || 'neutral',
      });
      const newRules = (data.rules || []).map(r => ({
        ...r,
        factors: (r.factors || []).map(ensure),
      }));
      return { ...data, rules: newRules, _migratedFrom: '1.0' };
    },
  };

  function migrateData(raw){
    if (!raw || typeof raw !== 'object') return raw;
    const ver = raw._schemaVersion || '0.9';
    let data = raw;
    // 链式迁移（多版本跳到最新）
    let cur = ver;
    while (cur !== SCHEMA_VERSION){
      const next = cur + '->' + SCHEMA_VERSION;
      // 直接跳到 SCHEMA_VERSION（兼容缺中间版本）
      const directJump = cur + '->' + SCHEMA_VERSION;
      if (MIGRATIONS[directJump]){
        data = MIGRATIONS[directJump](data);
        cur = SCHEMA_VERSION;
        break;
      }
      // 否则逐步
      const candidates = Object.keys(MIGRATIONS).filter(k => k.startsWith(cur + '->'));
      if (candidates.length === 0) break;
      // 选第一个能跑的
      data = MIGRATIONS[candidates[0]](data);
      cur = candidates[0].split('->')[1];
    }
    data._schemaVersion = SCHEMA_VERSION;
    data._migratedAt = new Date().toISOString();
    return data;
  }

  // 导出时附加版本号（供导入侧验证）
  function wrapExport(payload){
    return { ...payload, _schemaVersion: SCHEMA_VERSION, _exportedAt: new Date().toISOString() };
  }

  // ============================================================
  // 加密（简单的 base64 + 异或混淆，用于本地数据导出保护）
  // ============================================================
  function xorCipher(text, key){
    let out = '';
    for (let i = 0; i < text.length; i++){
      out += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return out;
  }
  function encryptExport(payload, password){
    if (!password) return wrapExport(payload);
    const text = JSON.stringify(payload);
    const encoded = btoa(unescape(encodeURIComponent(xorCipher(text, password))));
    return { _encrypted: true, _algorithm: 'xor-base64', _schemaVersion: SCHEMA_VERSION, _exportedAt: new Date().toISOString(), _data: encoded };
  }
  function decryptExport(wrapped, password){
    if (!wrapped._encrypted) return wrapExport(wrapped);
    try {
      const decoded = decodeURIComponent(escape(atob(wrapped._data)));
      const text = xorCipher(decoded, password);
      return JSON.parse(text);
    } catch(e){
      throw new Error('解密失败：密码错误或数据损坏');
    }
  }

  return {
    createMetricRule, createEntry, createScenario, createFactor,
    extractSignals, scoreFromSignals, deriveEvents, aggregateProfile,
    flattenFactors, trimmedMean, findOccurrences, inspectContext,
    deriveTimeCompression, deriveExperienceDensity, deriveResultOrientation,
    deriveLifeParticipation, deriveTimeTrace, deriveAllObservations,
    analyzeTimePattern, correlateDimensions, detectAnomalies,
    classifyProfileStructure, rankFactorHeat,
    computeStreak, deriveFactorContributions, buildCalendarData, searchEntries,
    migrateData, wrapExport, encryptExport, decryptExport,
    SCHEMA_VERSION, DEFAULT_NEGATIONS, DEFAULT_MODIFIERS,
    categoryOf, clamp
  };
})();

/* ============================================================
   LAYER 2 · REPOSITORY LAYER
   - IRepository<T> 接口
   - 三个实现：localStorage / InMemory / (IndexedDB 预留)
   ============================================================ */
const Repository = (() => {

  // 抽象接口（duck typing）
  class IRepository {
    async getAll(){ throw new Error('Not implemented'); }
    async save(items){ throw new Error('Not implemented'); }
    async clear(){ throw new Error('Not implemented'); }
  }

  // —— 实现 A：localStorage
  class LocalStorageRepository extends IRepository {
    constructor(key){ super(); this.key = key; }
    async getAll(){
      try { const v = localStorage.getItem(this.key); return v ? JSON.parse(v) : null; }
      catch(e){ console.warn(`[LocalStorageRepository] read failed for ${this.key}`, e); return null; }
    }
    async save(items){
      try { localStorage.setItem(this.key, JSON.stringify(items)); return true; }
      catch(e){ console.error(`[LocalStorageRepository] save failed for ${this.key}`, e); return false; }
    }
    async clear(){ localStorage.removeItem(this.key); }
  }

  // —— 实现 B：内存（用于测试或临时会话）
  class InMemoryRepository extends IRepository {
    constructor(){ super(); this._store = null; }
    async getAll(){ return this._store ? JSON.parse(JSON.stringify(this._store)) : null; }
    async save(items){ this._store = JSON.parse(JSON.stringify(items)); return true; }
    async clear(){ this._store = null; }
  }

  // —— 实现 C：带 fallback 的 localStorage（先用 localStorage，失败时退化到内存）
  class SafeLocalStorageRepository extends IRepository {
    constructor(key){
      super(); this.key = key;
      this._primary = new LocalStorageRepository(key);
      this._fallback = new InMemoryRepository();
      this._useFallback = false;
    }
    async getAll(){
      if (this._useFallback) return this._fallback.getAll();
      const data = await this._primary.getAll();
      if (data === null && !this._useFallback){
        // 检查是否真的没有数据
        return null;
      }
      return data;
    }
    async save(items){
      const ok = await this._primary.save(items);
      if (!ok){ this._useFallback = true; return this._fallback.save(items); }
      return true;
    }
    async clear(){
      await this._primary.clear();
      await this._fallback.clear();
    }
  }

  return { IRepository, LocalStorageRepository, InMemoryRepository, SafeLocalStorageRepository };
})();

/* ============================================================
   LAYER 3 · SERVICE LAYER
   - 业务编排：调用 Repository 完成 CRUD + 调用 Domain 完成计算
   - 不接触 UI 和 DOM
   ============================================================ */
const Service = (() => {

  class RuleService {
    constructor(repo, defaults){
      this.repo = repo; this.defaults = defaults;
      this._items = null;
    }
    async load(){
      if (this._items) return this._items;
      let data = await this.repo.getAll();
      if (!data) data = JSON.parse(JSON.stringify(this.defaults));
      // 迁移到当前 schema
      data = Domain.migrateData(data);
      this._items = data.map(r => Domain.createMetricRule(r));
      return this._items;
    }
    async persist(){
      await this.repo.save(this._items);
    }
    getAll(){ return this._items ? [...this._items] : []; }
    findByKey(key){ return this._items ? this._items.find(r => r.key === key) : null; }
    async update(key, patch){
      const idx = this._items.findIndex(r => r.key === key);
      if (idx === -1) return null;
      const updated = Domain.createMetricRule({...this._items[idx], ...patch, key}); // key 不可改
      this._items[idx] = updated;
      await this.persist();
      return updated;
    }
    async create(partial){
      const newRule = Domain.createMetricRule({
        key: partial.key || `X${this._items.length + 1}`,
        cat: partial.cat || 'D',
        name: partial.name || '新维度',
        q: partial.q || '请填写问题',
        desc: partial.desc || '请填写说明',
        weight: partial.weight ?? 0.5,
        threshold: partial.threshold ?? 0.3,
        signals: partial.signals || []
      });
      this._items.push(newRule);
      await this.persist();
      return newRule;
    }
    async remove(key){
      if (this._items.length <= 1) throw new Error('至少保留一个维度');
      const removed = this._items.find(r => r.key === key);
      this._items = this._items.filter(r => r.key !== key);
      await this.persist();
      return removed;
    }
    async duplicate(key){
      const orig = this.findByKey(key);
      if (!orig) return null;
      const copy = {...orig, key:`X${this._items.length + 1}`, name: orig.name + ' (副本)'};
      return this.create(copy);
    }
    async reset(key){
      const seed = this.defaults.find(r => r.key === key);
      if (!seed) return null;
      return this.update(key, {...seed});
    }
    addSignal(key, sig){
      const r = this.findByKey(key);
      if (!r || !sig || r.signals.includes(sig)) return false;
      r.signals.push(sig);
      this.persist();
      return true;
    }
    removeSignal(key, idx){
      const r = this.findByKey(key);
      if (!r || idx < 0 || idx >= r.signals.length) return false;
      r.signals.splice(idx, 1);
      this.persist();
      return true;
    }
  }

  class EntryService {
    constructor(repo, ruleService){
      this.repo = repo; this.ruleService = ruleService;
      this._items = null;
    }
    async load(){
      if (this._items) return this._items;
      let data = await this.repo.getAll();
      if (!data) data = [];
      data = Domain.migrateData(data);
      this._items = data.map(e => Domain.createEntry(e));
      return this._items;
    }
    async persist(){ await this.repo.save(this._items); }
    getAll(){ return this._items ? [...this._items] : []; }
    findById(id){ return this._items ? this._items.find(e => e.id === id) : null; }
    async create(partial){
      const rules = this.ruleService.getAll();
      const text = partial.text || '';
      const signals = partial.signals || Domain.extractSignals(text, rules);
      let score, factorScores;
      if (partial.score && partial.factorScores){
        score = partial.score; factorScores = partial.factorScores;
      } else {
        const scored = Domain.scoreFromSignals(signals, rules);
        score = scored.dimScore; factorScores = scored.factorScore;
      }
      const entry = Domain.createEntry({...partial, signals, score, factorScores});
      this._items.unshift(entry);
      await this.persist();
      return entry;
    }
    async update(id, patch){
      const idx = this._items.findIndex(e => e.id === id);
      if (idx === -1) return null;
      const updated = Domain.createEntry({...this._items[idx], ...patch, id});
      // 如果文本变了，重新抽取信号和评分
      if (patch.text && patch.text !== this._items[idx].text){
        const rules = this.ruleService.getAll();
        updated.signals = Domain.extractSignals(updated.text, rules);
        const scored = Domain.scoreFromSignals(updated.signals, rules);
        updated.score = scored.dimScore; updated.factorScores = scored.factorScore;
      }
      this._items[idx] = updated;
      await this.persist();
      return updated;
    }
    async remove(id){
      const before = this._items.length;
      this._items = this._items.filter(e => e.id !== id);
      if (this._items.length === before) return false;
      await this.persist();
      return true;
    }
    async clearAll(){
      this._items = [];
      await this.persist();
    }
    filter({ search, cat, period, sortBy, sortDir } = {}){
      let list = this.getAll();
      if (search){
        const q = search.toLowerCase();
        list = list.filter(e => {
          const hay = (e.text + ' ' + e.date + ' ' + (e.signals||[]).map(s => s.cat+' '+s.src).join(' ')).toLowerCase();
          return hay.includes(q);
        });
      }
      if (cat) list = list.filter(e => (e.signals||[]).some(s => s.cat === cat));
      if (period){
        const days = Number(period);
        if (!isNaN(days)){
          const cutoff = Date.now() - days * 86400000;
          list = list.filter(e => new Date(e.date).getTime() >= cutoff);
        }
      }
      if (sortBy){
        list = list.slice().sort((a,b) => {
          let va = a[sortBy], vb = b[sortBy];
          if (sortBy === 'signals') { va = (a.signals||[]).length; vb = (b.signals||[]).length; }
          if (va < vb) return sortDir === 'asc' ? -1 : 1;
          if (va > vb) return sortDir === 'asc' ? 1 : -1;
          return 0;
        });
      }
      return list;
    }
  }

  class ScenarioService {
    constructor(repo, defaults){
      this.repo = repo; this.defaults = defaults;
      this._items = null;
    }
    async load(){
      if (this._items) return this._items;
      let data = await this.repo.getAll();
      if (!data) data = JSON.parse(JSON.stringify(this.defaults));
      data = Domain.migrateData(data);
      this._items = data.map(s => Domain.createScenario(s));
      return this._items;
    }
    async persist(){ await this.repo.save(this._items); }
    getAll(){ return this._items ? [...this._items] : []; }
    async create(partial){
      const sc = Domain.createScenario(partial);
      this._items.push(sc);
      await this.persist();
      return sc;
    }
    async remove(id){
      this._items = this._items.filter(s => s.id !== id);
      await this.persist();
    }
  }

  class ExtractService {
    constructor(ruleService){
      this.ruleService = ruleService;
    }
    run(text){
      const rules = this.ruleService.getAll();
      const signals = Domain.extractSignals(text, rules);
      const { dimScore, factorScore } = Domain.scoreFromSignals(signals, rules);
      const sumW = signals.reduce((s, h) => s + (h.weight || 1), 0);
      const confidence = Math.min(100, Math.round((sumW / Math.max(signals.length, 1)) * 60 + Math.min(signals.length, 10) * 4));
      return { signals, dimScore, factorScore, score: dimScore, confidence };
    }
  }

  class ProfileService {
    constructor(ruleService, entryService){
      this.ruleService = ruleService;
      this.entryService = entryService;
    }
    compute(period){
      const rules = this.ruleService.getAll();
      const entries = this.entryService.getAll();
      return Domain.aggregateProfile(entries, rules, period);
    }
    recent(limit = 6){
      return this.entryService.getAll().slice(0, limit);
    }
    // 综合画像：返回 dimAggregation + 5 个观察指标 + 画像类型 + 相关性 + 异常 + 时间模式 + 因子热度
    comprehensive(period){
      const agg = this.compute(period);
      const observations = Domain.deriveAllObservations(agg.dimAggregation);
      const type = Domain.classifyProfileStructure(agg.dimAggregation);
      const correlations = Domain.correlateDimensions(this.entryService.getAll());
      const anomalies = Domain.detectAnomalies(this.entryService.getAll(), agg.dimAggregation);
      const timePattern = Domain.analyzeTimePattern(this.entryService.getAll());
      const factorHeat = Domain.rankFactorHeat(this.entryService.getAll(), this.ruleService.getAll());
      return { ...agg, observations, type, correlations, anomalies, timePattern, factorHeat };
    }
  }

  // 观察指标服务（独立的 Service · 可单独订阅）
  class ObservationService {
    constructor(ruleService, entryService){
      this.ruleService = ruleService;
      this.entryService = entryService;
    }
    compute(period){
      const rules = this.ruleService.getAll();
      const entries = this.entryService.getAll();
      const agg = Domain.aggregateProfile(entries, rules, period);
      return {
        observations: Domain.deriveAllObservations(agg.dimAggregation),
        type: Domain.classifyProfileStructure(agg.dimAggregation),
        correlations: Domain.correlateDimensions(entries),
        anomalies: Domain.detectAnomalies(entries, agg.dimAggregation),
        timePattern: Domain.analyzeTimePattern(entries),
        factorHeat: Domain.rankFactorHeat(entries, rules),
        period,
        sampleSize: agg.sampleSize
      };
    }
  }

  class ImportExportService {
    constructor(ruleService, entryService, scenarioService){
      this.ruleService = ruleService;
      this.entryService = entryService;
      this.scenarioService = scenarioService;
    }

    export({ rules = true, entries = true, events = false, scenarios = false, format = 'json', password = null } = {}){
      const inner = { _meta: { exportedAt: new Date().toISOString(), source: 'TimeTrace v1.0' } };
      if (rules) inner.rules = this.ruleService.getAll();
      if (entries) inner.entries = this.entryService.getAll();
      if (events) inner.events = Domain.deriveEvents(this.entryService.getAll());
      if (scenarios) inner.scenarios = this.scenarioService.getAll();
      // 加密 / 普通导出
      const payload = password ? Domain.encryptExport(inner, password) : Domain.wrapExport(inner);
      return { payload, text: this._serialize(payload, format), format, encrypted: !!password };
    }

    import(payload){
      let count = 0;
      if (Array.isArray(payload.entries)){
        payload.entries.forEach(e => {
          this.entryService.create(e);
          count++;
        });
      }
      if (Array.isArray(payload.scenarios)){
        payload.scenarios.forEach(s => this.scenarioService.create(s));
      }
      return count;
    }

    _serialize(payload, fmt){
      if (fmt === 'json') return JSON.stringify(payload, null, 2);
      if (fmt === 'csv') return this._toCSV(payload);
      if (fmt === 'yaml') return this._toYAML(payload);
      return '';
    }

    _csvEsc(s){ s = String(s || ''); if (/[,"\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"'; return s; }
    _toCSV(payload){
      const lines = [];
      if (payload.entries){
        lines.push('# entries');
        lines.push(['id','date','text','mood','scenario','D1','D2','D3','S1','S2','S3','T1','T2','T3'].join(','));
        payload.entries.forEach(e => {
          const s = e.score || {};
          lines.push([e.id, e.date, this._csvEsc(e.text), e.mood||'', e.scenario||'', s.D1||'', s.D2||'', s.D3||'', s.S1||'', s.S2||'', s.S3||'', s.T1||'', s.T2||'', s.T3||''].join(','));
        });
      }
      if (payload.rules){
        lines.push('# rules');
        lines.push(['key','cat','name','weight','threshold','signals'].join(','));
        payload.rules.forEach(r => {
          lines.push([r.key, r.cat, this._csvEsc(r.name), r.weight, r.threshold, this._csvEsc((r.signals||[]).join('|'))].join(','));
        });
      }
      return lines.join('\n');
    }
    _toYAML(payload){
      const out = [];
      if (payload._meta){
        out.push('_meta:');
        Object.entries(payload._meta).forEach(([k,v]) => out.push(`  ${k}: ${JSON.stringify(v)}`));
      }
      if (payload.rules){
        out.push('rules:');
        payload.rules.forEach(r => {
          out.push(`  - key: ${r.key}`);
          out.push(`    cat: ${r.cat}`);
          out.push(`    name: ${JSON.stringify(r.name)}`);
          out.push(`    weight: ${r.weight}`);
          out.push(`    threshold: ${r.threshold}`);
          out.push(`    signals: [${(r.signals||[]).map(s => JSON.stringify(s)).join(', ')}]`);
        });
      }
      if (payload.entries){
        out.push('entries:');
        payload.entries.forEach(e => {
          out.push(`  - id: ${e.id}`);
          out.push(`    date: ${e.date}`);
          out.push(`    text: ${JSON.stringify(e.text)}`);
          if (e.mood) out.push(`    mood: ${e.mood}`);
          if (e.scenario) out.push(`    scenario: ${e.scenario}`);
        });
      }
      return out.join('\n');
    }

    parseFile(text, filename){
      const lower = filename.toLowerCase();
      if (lower.endsWith('.json')) return JSON.parse(text);
      if (lower.endsWith('.csv') || lower.endsWith('.tsv')) return this._parseCSV(text, lower.endsWith('.tsv') ? '\t' : ',');
      if (lower.endsWith('.yaml') || lower.endsWith('.yml')) return this._parseYAML(text);
      throw new Error('不支持的文件格式');
    }

    _parseCSV(text, sep){
      sep = sep || ',';
      const lines = text.replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim());
      if (lines.length === 0) return [];
      const headers = this._parseCSVLine(lines[0], sep);
      return lines.slice(1).map(line => {
        const cells = this._parseCSVLine(line, sep);
        const obj = {};
        headers.forEach((h, i) => obj[h] = (cells[i] || '').trim());
        return obj;
      });
    }
    _parseCSVLine(line, sep){
      const out = []; let cur = ''; let inQuote = false;
      for (let i = 0; i < line.length; i++){
        const c = line[i];
        if (inQuote){
          if (c === '"' && line[i+1] === '"'){ cur += '"'; i++; }
          else if (c === '"'){ inQuote = false; }
          else cur += c;
        } else {
          if (c === '"') inQuote = true;
          else if (c === sep){ out.push(cur); cur = ''; }
          else cur += c;
        }
      }
      out.push(cur);
      return out;
    }
    _parseYAML(text){
      const lines = text.replace(/\r\n?/g, '\n').split('\n');
      const result = []; let cur = null;
      lines.forEach(line => {
        const t = line.trim();
        if (!t || t.startsWith('#')) return;
        let m = t.match(/^-\s*(\w+):\s*(.*)$/);
        if (m){
          if (cur) result.push(cur);
          cur = {}; cur[m[1]] = m[2].replace(/^["']|["']$/g, '');
          return;
        }
        m = t.match(/^(\w+):\s*(.*)$/);
        if (m && cur) cur[m[1]] = m[2].replace(/^["']|["']$/g, '');
      });
      if (cur) result.push(cur);
      return result;
    }
  }

  return { RuleService, EntryService, ScenarioService, ExtractService, ProfileService, ObservationService, ImportExportService };
})();

/* ============================================================
   LAYER 4 · STATE LAYER
   - EventBus：发布订阅总线
   - Store：单一数据源 + 订阅变更
   ============================================================ */
const EventBus = (() => {
  const listeners = new Map();
  return {
    on(event, fn){
      if (!listeners.has(event)) listeners.set(event, new Set());
      listeners.get(event).add(fn);
      return () => listeners.get(event).delete(fn);
    },
    emit(event, payload){
      const set = listeners.get(event);
      if (set) set.forEach(fn => { try { fn(payload); } catch(e){ console.error('[EventBus]', event, e); } });
    },
    clear(){ listeners.clear(); }
  };
})();

const Store = (() => {
  const state = {
    rules: [],
    entries: [],
    scenarios: [],
    ui: {
      activeView: 'rules',
      activeRuleKey: 'D1',
      activeDbTab: 'entries',
      dbPage: 1,
      dbPageSize: 8,
      dbSearch: '',
      dbFilterCat: '',
      dbFilterPeriod: '',
      wbPeriod: 7
    },
    meta: {
      rulesUpdatedAt: null,
      lastOp: null
    }
  };

  return {
    get(){ return state; },
    getRules(){ return state.rules; },
    getEntries(){ return state.entries; },
    getScenarios(){ return state.scenarios; },
    getUI(){ return state.ui; },
    setRules(arr){ state.rules = arr; EventBus.emit('rules:changed', arr); },
    setEntries(arr){ state.entries = arr; EventBus.emit('entries:changed', arr); },
    setScenarios(arr){ state.scenarios = arr; EventBus.emit('scenarios:changed', arr); },
    setUI(patch){ Object.assign(state.ui, patch); EventBus.emit('ui:changed', state.ui); },
    setMeta(patch){ Object.assign(state.meta, patch); EventBus.emit('meta:changed', state.meta); },
    subscribe(event, fn){ return EventBus.on(event, fn); }
  };
})();

      handlers.switchView('ie');
      setTimeout(() => document.getElementById('btn-export-download').click(), 200);
    });
    // 主题切换
    const themeBtn = document.getElementById('btn-theme');
    if (themeBtn){
      const savedTheme = localStorage.getItem('tt_theme');
      if (savedTheme === 'dark'){
        document.documentElement.setAttribute('data-theme', 'dark');
        themeBtn.textContent = '☀ 亮';
      }
      themeBtn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        if (next === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); themeBtn.textContent = '☀ 亮'; }
        else { document.documentElement.removeAttribute('data-theme'); themeBtn.textContent = '☾ 暗'; }
        localStorage.setItem('tt_theme', next);
      });
    }
    // 搜索按钮
    const searchBtn = document.getElementById('btn-search');
    if (searchBtn){
      searchBtn.addEventListener('click', openSearchModal);
    }
    // ⌘/Ctrl + / 快捷键打开搜索
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === '/'){
        e.preventDefault();
        openSearchModal();
      }
    });
  }

  async function bootstrap(){

    Store.setRules(rules);
    Store.setEntries(entries);
    Store.setScenarios(scenarios);

  function renderRulesMeta(){
    const meta = Store.get('meta');
    document.getElementById('rs-updated').textContent = meta.rulesUpdatedAt ? '已更新 ' + new Date(meta.rulesUpdatedAt).toLocaleTimeString() : '未修改';
  }

  // —— Views 渲染
  let activeRuleKey = 'D1';
  let activeDbTab = 'entries';
  let dbPage = 1;
  const DB_PAGE_SIZE = 8;

  function renderRules(){
    const rules = Store.getRules();
    const list = document.getElementById('rule-list');
    if (!list) return;
    list.innerHTML = rules.map(r => {
      const enabled = (r.factors || []).filter(f => f.enabled).length;
      const total = (r.factors || []).length;
      return `
      <div class="rule-row${r.key === activeRuleKey ? ' active' : ''}" data-key="${r.key}">
        <span class="code">${r.key}</span>
        <div class="meta"><div class="name">${UI.esc(r.name)}</div><div class="desc">${UI.esc(r.q)} · ${enabled}/${total} 因子</div></div>
        <span class="weight">权 <b>${r.weight.toFixed(1)}</b></span>
      </div>`;}).join('');
    list.querySelectorAll('.rule-row').forEach(row => {
      row.addEventListener('click', () => {
        activeRuleKey = row.dataset.key;
        renderRules();
        renderRuleDetail();
      });
    });

    // 顶部统计（基于因子）
    const allFactors = rules.flatMap(r => r.factors || []);
    const totalFactors = allFactors.length;
    const enabledFactors = allFactors.filter(f => f.enabled).length;
    const totalSignals = allFactors.filter(f => f.enabled).reduce((s,f) => s + (f.signals || []).length, 0);
    const avgW = rules.reduce((s, r) => s + r.weight, 0) / Math.max(rules.length, 1);
    const ftEl = document.getElementById('rs-factor-total');
    if (ftEl) ftEl.innerHTML = totalFactors + '<span class="unit">项</span>';
    const sgEl = document.getElementById('rs-signal-total');
    if (sgEl) sgEl.innerHTML = totalSignals + '<span class="unit">条</span>';
    const wEl = document.getElementById('rs-weight-avg');
    if (wEl) wEl.innerHTML = avgW.toFixed(2) + '<span class="unit">/1</span>';

    renderRuleDetail();
  }

  function renderRuleDetail(){
    const r = Store.getRules().find(x => x.key === activeRuleKey);
    if (!r) return;
    const factors = r.factors || [];
    const enabledCount = factors.filter(f => f.enabled).length;
    const totalSignals = factors.reduce((s,f) => s + (f.enabled ? f.signals.length : 0), 0);
    const avgWeight = factors.length ? (factors.reduce((s,f) => s + (f.enabled ? f.weight : 0), 0) / Math.max(enabledCount, 1)) : 0;

    document.getElementById('rule-detail').innerHTML = `
      <div class="head-row">
        <div>
          <h2><span class="badge ${r.cat}" style="font-size:12px;vertical-align:middle;margin-right:10px">${r.cat}</span>${r.key} · ${UI.esc(r.name)}</h2>
          <div class="meta-row" style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><span class="badge ghost">${UI.esc(r.q)}</span></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost btn-sm" id="rd-reset">重置</button>
          <button class="btn btn-ghost btn-sm" id="rd-duplicate">复制</button>
          <button class="btn btn-danger btn-sm" id="rd-delete">删除</button>
        </div>
      </div>
      <div class="rule-grid">
        <div>
          <div class="field"><div class="label">维度名称</div><input type="text" id="rd-name" value="${UI.esc(r.name)}"/></div>
          <div class="field"><div class="label">核心问题</div><input type="text" id="rd-q" value="${UI.esc(r.q)}"/></div>
          <div class="field"><div class="label">分类</div><select id="rd-cat">
            <option value="D"${r.cat==='D'?' selected':''}>D · 发生</option>
            <option value="S"${r.cat==='S'?' selected':''}>S · 结构</option>
            <option value="T"${r.cat==='T'?' selected':''}>T · 留痕</option>
          </select></div>
          <div class="field"><div class="label">维度权重（0–1）</div><div class="slider-row"><input type="range" id="rd-weight" min="0" max="1" step="0.05" value="${r.weight}"/><span class="slider-val" id="rd-weight-v">${r.weight.toFixed(2)}</span></div></div>
          <div class="field"><div class="label">触发阈值（0–1）</div><div class="slider-row"><input type="range" id="rd-threshold" min="0" max="1" step="0.05" value="${r.threshold}"/><span class="slider-val" id="rd-threshold-v">${r.threshold.toFixed(2)}</span></div></div>
        </div>
        <div>
          <div class="field"><div class="label">说明</div><textarea id="rd-desc" style="min-height:120px;font-size:13px;font-family:var(--sans)">${UI.esc(r.desc)}</textarea></div>
        </div>
      </div>

      <div class="factor-summary">
        <div class="item"><div class="lbl">因子数</div><div class="v">${factors.length}<span style="font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:4px">（启用 ${enabledCount}）</span></div></div>
        <div class="item"><div class="lbl">信号总数</div><div class="v">${totalSignals}<span style="font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:4px">词</span></div></div>
        <div class="item"><div class="lbl">平均权重</div><div class="v">${avgWeight.toFixed(2)}</div></div>
        <div class="item"><div class="lbl">操作</div><div style="display:flex;gap:6px;margin-top:4px"><button class="btn btn-ghost btn-sm" id="rd-factor-add">＋ 新增因子</button><button class="btn btn-ghost btn-sm" id="rd-factor-expand">全部展开</button></div></div>
      </div>

      <div class="factor-editor">
        <div class="head"><h5>二级因子（Factor）</h5><span class="count">每个因子含独立权重与关键词集</span></div>
        <div class="factor-list" id="factor-list"></div>
      </div>

      <div class="rules-tips">提示：<b>因子</b>是维度的细粒度拆解，例如 <code style="font-family:var(--mono);font-size:11px;background:var(--paper);padding:1px 5px;border-radius:3px">D1-工作</code>、<code style="font-family:var(--mono);font-size:11px;background:var(--paper);padding:1px 5px;border-radius:3px">D1-家庭</code>。每个因子有独立权重与关键词集合，AI 抽取时会自动归类到对应因子。修改后请点击右上角「保存修改」。</div>`;

    document.getElementById('rd-weight').addEventListener('input', e => document.getElementById('rd-weight-v').textContent = parseFloat(e.target.value).toFixed(2));
    document.getElementById('rd-threshold').addEventListener('input', e => document.getElementById('rd-threshold-v').textContent = parseFloat(e.target.value).toFixed(2));
    document.getElementById('rd-reset').addEventListener('click', async () => { await ruleService.reset(r.key); Store.setRules(ruleService.getAll()); Store.setMeta({rulesUpdatedAt: Date.now()}); UI.toast('已重置为默认值','success'); });
    document.getElementById('rd-duplicate').addEventListener('click', async () => { await ruleService.duplicate(r.key); Store.setRules(ruleService.getAll()); UI.toast('已复制','success'); });
    document.getElementById('rd-delete').addEventListener('click', async () => {
      if (!confirm('确认删除 ' + r.key + ' ？')) return;
      try { await ruleService.remove(r.key); Store.setRules(ruleService.getAll()); activeRuleKey = ruleService.getAll()[0].key; UI.toast('已删除'); }
      catch(e){ UI.toast(e.message,'error'); }
    });
    document.getElementById('rd-factor-add').addEventListener('click', () => {
      r.factors = r.factors || [];
      r.factors.push({ id: r.key + '-N' + (r.factors.length + 1), name:'新因子', desc:'请填写说明', signals:[], weight:0.5, enabled:true });
      ruleService.persist();
      Store.setRules(ruleService.getAll());
      UI.toast('已新增因子','success');
    });
    document.getElementById('rd-factor-expand').addEventListener('click', () => {
      document.querySelectorAll('.factor-row').forEach(el => el.classList.remove('disabled'));
    });
    renderFactorList(r);
  }

  function renderFactorList(rule){
    const wrap = document.getElementById('factor-list');
    if (!wrap) return;
    const factors = rule.factors || [];
    if (factors.length === 0){
      wrap.innerHTML = '<div class="factor-empty">暂无因子，点击右上角「＋ 新增因子」开始拆解。</div>';
      return;
    }
    wrap.innerHTML = factors.map((f, idx) => `
      <div class="factor-row ${f.enabled ? '' : 'disabled'}" data-i="${idx}">
        <div class="factor-row-top">
          <div class="left">
            <input type="checkbox" data-fld="enabled" data-i="${idx}" ${f.enabled ? 'checked' : ''}/>
            <input type="text" class="nm" data-fld="name" data-i="${idx}" value="${UI.esc(f.name)}" placeholder="因子名称"/>
            <span class="id">${UI.esc(f.id)}</span>${UI.factorInfoHTML(f)}
          </div>
          <div class="slider-row">
            <span>权重</span>
            <input type="range" min="0" max="1" step="0.05" value="${f.weight}" data-fld="weight" data-i="${idx}"/>
            <span class="slider-val" data-fld="weight-v">${f.weight.toFixed(2)}</span>
          </div>
          <div class="actions">
            <button class="btn btn-danger btn-sm" data-fld="del" data-i="${idx}" title="删除">×</button>
          </div>
        </div>
        <input type="text" class="desc-edit" data-fld="desc" data-i="${idx}" value="${UI.esc(f.desc || '')}" placeholder="因子说明（可选）"/>
        <textarea class="signals-edit" data-fld="signals" data-i="${idx}" placeholder="信号关键词（用 / 或 空格分隔）">${UI.esc((f.signals || []).join(' / '))}</textarea>
      </div>`).join('');

    wrap.querySelectorAll('[data-fld]').forEach(el => {
      const i = parseInt(el.dataset.i, 10);
      const fld = el.dataset.fld;
      if (fld === 'del'){
        el.addEventListener('click', () => {
          if (!confirm('删除因子「' + (factors[i].name) + '」？')) return;
          factors.splice(i, 1);
          ruleService.persist();
          Store.setRules(ruleService.getAll());
          UI.toast('已删除因子');
        });
      } else if (fld === 'enabled'){
        el.addEventListener('change', () => {
          factors[i].enabled = el.checked;
          el.closest('.factor-row').classList.toggle('disabled', !el.checked);
          ruleService.persist();
          Store.setRules(ruleService.getAll());
        });
      } else if (fld === 'weight'){
        el.addEventListener('input', () => {
          const v = parseFloat(el.value);
          factors[i].weight = v;
          el.parentElement.querySelector('[data-fld="weight-v"]').textContent = v.toFixed(2);
          ruleService.persist();
        });
        el.addEventListener('change', () => Store.setRules(ruleService.getAll()));
      } else if (fld === 'name' || fld === 'desc'){
        el.addEventListener('input', () => {
          factors[i][fld] = el.value;
          ruleService.persist();
        });
        el.addEventListener('blur', () => Store.setRules(ruleService.getAll()));
      } else if (fld === 'signals'){
        el.addEventListener('input', () => {
          factors[i].signals = el.value.split(/[\s\/,，、]+/).filter(Boolean);
          ruleService.persist();
        });
        el.addEventListener('blur', () => Store.setRules(ruleService.getAll()));
      }
    });
  }

  function renderSignalTags(rule){
    const wrap = document.getElementById('rd-tags');
    wrap.innerHTML = '';
    rule.signals.forEach((s, i) => {
      const t = document.createElement('span');
      t.className = 'signal-tag';
      t.innerHTML = UI.esc(s) + ' <span class="x" data-i="' + i + '">×</span>';
      wrap.appendChild(t);
    });
    const input = document.createElement('input');
    input.type = 'text'; input.className = 'signal-input'; input.placeholder = '+ 添加关键词';
    wrap.appendChild(input);
    wrap.querySelectorAll('.x').forEach(x => {
      x.addEventListener('click', () => { ruleService.removeSignal(rule.key, +x.dataset.i); Store.setRules(ruleService.getAll()); });
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){
        const v = input.value.trim();
        if (v){ ruleService.addSignal(rule.key, v); Store.setRules(ruleService.getAll()); }
        input.value = '';
      }
    });
  }

  async function saveCurrentRule(){
    const r = Store.getRules().find(x => x.key === activeRuleKey);
    if (!r) return;
    await ruleService.update(r.key, {
      name: document.getElementById('rd-name').value.trim() || r.name,
      q: document.getElementById('rd-q').value.trim() || r.q,
      cat: document.getElementById('rd-cat').value,
      weight: parseFloat(document.getElementById('rd-weight').value),
      threshold: parseFloat(document.getElementById('rd-threshold').value),
      desc: document.getElementById('rd-desc').value.trim() || r.desc
    });
    Store.setRules(ruleService.getAll());
    Store.setMeta({rulesUpdatedAt: Date.now()});
    UI.toast('规则已保存','success');
  }

  // —— DB View
  function renderDb(){
    const entries = Store.getEntries();
    const scenarios = Store.getScenarios();
    const events = Domain.deriveEvents(entries);
    document.getElementById('db-stat-entries').textContent = entries.length;
    document.getElementById('db-stat-events').textContent = events.length;
    const sigCount = entries.reduce((s, e) => s + (e.signals ? e.signals.length : 0), 0);
    document.getElementById('db-stat-signals').textContent = sigCount;
    const last = entries.map(e => e.date).sort().pop();
    document.getElementById('db-stat-last').textContent = last || '—';
    document.getElementById('tab-count-entries').textContent = entries.length;
    document.getElementById('tab-count-events').textContent = events.length;
    document.getElementById('tab-count-scenarios').textContent = scenarios.length;
    document.getElementById('exp-entries-cnt').textContent = entries.length + ' 条';

    if (activeDbTab === 'entries') renderEntriesTable();
    else if (activeDbTab === 'events') renderEventsTable();
    else renderScenariosTable();
  }

  function renderEntriesTable(){
    const ui = Store.getUI();
    const data = entryService.filter({ search: ui.dbSearch, cat: ui.dbFilterCat, period: ui.dbFilterPeriod, sortBy: ui.sortBy || 'date', sortDir: ui.sortDir || 'desc' });
    const total = data.length;
    const pages = Math.max(1, Math.ceil(total / DB_PAGE_SIZE));
    if (dbPage > pages) dbPage = pages;
    const slice = data.slice((dbPage-1) * DB_PAGE_SIZE, dbPage * DB_PAGE_SIZE);

    document.getElementById('db-thead').innerHTML = '<tr><th class="sel"><input type="checkbox" id="sel-all"/></th><th class="sortable" data-sort="date">日期 <span class="sort-ind">↓</span></th><th>内容</th><th>命中信号</th><th>场景</th><th style="text-align:right">操作</th></tr>';
    document.getElementById('db-tbody').innerHTML = slice.length === 0
      ? '<tr><td colspan="6" class="db-empty">' +
        '<div class="empty-state"><div class="glyph">∅</div><h4>暂无数据</h4><p>试试切换筛选条件，或者新增一条日记。</p>' +
        '<button class="btn btn-primary btn-sm" onclick="document.getElementById(\'btn-db-add\').click()">＋ 新增第一条</button></div>' +
        '</td></tr>'
      : slice.map(e => {
          // 按因子聚合：每个因子显示一次 + 命中数
          const byFactor = {};
          (e.signals||[]).forEach(s => {
            const k = s.factorId || ('_L_' + s.key);
            if (!byFactor[k]) byFactor[k] = { ...s, count: 0 };
            byFactor[k].count++;
          });
          const sigList = Object.values(byFactor);
          const tags = sigList.slice(0,4).map(s => {
            const factorName = s.factorName ? ' · ' + s.factorName : '';
            const cnt = s.count > 1 ? ' ×' + s.count : '';
            return '<span class="badge ' + s.cat + '" style="margin-right:3px" title="' + UI.esc(s.src) + '">' + s.key + factorName + cnt + '</span>';
          }).join('') +
            ((e.signals||[]).length > 4 ? '<span class="badge ghost">+' + ((e.signals||[]).length-4) + '</span>' : '');
          const isSel = selectedIds.has(e.id);
          return '<tr data-id="' + e.id + '" class="' + (isSel ? 'selected' : '') + '">' +
            '<td class="sel"><input type="checkbox" ' + (isSel ? 'checked' : '') + ' data-sel="' + e.id + '"/></td>' +
            '<td class="date">' + e.date + '</td>' +
            '<td class="text" title="' + UI.esc(e.text) + '">' + UI.esc(e.text) + '</td>' +
            '<td>' + tags + '</td>' +
            '<td><span class="badge ghost">' + UI.esc(e.scenario || '—') + '</span></td>' +
            '<td><div class="actions">' +
              '<button class="btn btn-ghost btn-sm" data-act="view" data-id="' + e.id + '">查看</button>' +
              '<button class="btn btn-ghost btn-sm" data-act="edit" data-id="' + e.id + '">编辑</button>' +
              '<button class="btn btn-danger btn-sm" data-act="del" data-id="' + e.id + '">删除</button>' +
            '</div></td></tr>';
        }).join('');
    document.getElementById('db-page-info').textContent = '共 ' + total + ' 条 · 第 ' + dbPage + ' / ' + pages + ' 页';
    let pg = '<button class="page-btn" data-pg="prev"' + (dbPage<=1?' disabled':'') + '>‹</button>';
    for (let i = 1; i <= pages; i++){
      if (pages > 7 && i > 2 && i < pages - 1 && Math.abs(i - dbPage) > 1){
        if (i === 3 || i === pages - 2) pg += '<span style="padding:0 4px;color:var(--ink-faint)">…</span>';
        continue;
      }
      pg += '<button class="page-btn' + (i===dbPage?' active':'') + '" data-pg="' + i + '">' + i + '</button>';
    }
    pg += '<button class="page-btn" data-pg="next"' + (dbPage>=pages?' disabled':'') + '>›</button>';
    document.getElementById('db-pages').innerHTML = pg;

    document.getElementById('db-pages').querySelectorAll('.page-btn').forEach(b => {
      b.addEventListener('click', () => {
        const p = b.dataset.pg;
        if (p === 'prev') dbPage--;
        else if (p === 'next') dbPage++;
        else dbPage = +p;
        renderEntriesTable();
      });
    });
    document.getElementById('db-tbody').querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.dataset.id, act = b.dataset.act;
        if (act === 'view') viewEntry(id);
        else if (act === 'edit') editEntry(id);
        else if (act === 'del') deleteEntry(id);
      });
    });
    // 多选
    document.querySelectorAll('#db-tbody input[data-sel]').forEach(cb => {
      cb.addEventListener('change', () => toggleSelect(cb.dataset.sel));
    });
    const selAll = document.getElementById('sel-all');
    if (selAll){
      const allInPageSelected = slice.length > 0 && slice.every(e => selectedIds.has(e.id));
      selAll.checked = allInPageSelected;
      selAll.addEventListener('change', () => {
        slice.forEach(e => selAll.checked ? selectedIds.add(e.id) : selectedIds.delete(e.id));
        renderEntriesTable(); renderBatchBar();
      });
    }
    // 排序
    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const cur = Store.getUI();
        const dir = cur.sortDir === 'asc' ? 'desc' : 'asc';
        Store.setUI({ sortBy: th.dataset.sort, sortDir: dir });
        renderEntriesTable();
      });
    });
    renderBatchBar();
  }

  function renderEventsTable(){
    const evs = Domain.deriveEvents(Store.getEntries());
    document.getElementById('db-thead').innerHTML = '<tr><th>事件</th><th>出现次数</th><th>最近日期</th></tr>';
    document.getElementById('db-tbody').innerHTML = evs.length === 0
      ? '<tr><td colspan="3" class="db-empty">尚无 D3 事件。</td></tr>'
      : evs.sort((a,b) => b.count - a.count).map(e =>
          '<tr><td><span class="badge D">D3</span> ' + UI.esc(e.src) + '</td><td><b>' + e.count + '</b></td><td class="date">' + (e.dates.sort().pop() || '—') + '</td></tr>'
        ).join('');
    document.getElementById('db-page-info').textContent = '共 ' + evs.length + ' 个去重事件';
    document.getElementById('db-pages').innerHTML = '';
  }

  function viewEntry(id){
    const e = entryService.findById(id);
    if (!e) return;
    UI.modal.open('查看 · ' + e.date,
      '<div class="field"><div class="label">内容</div><div style="font-family:var(--serif);font-size:var(--fs-lg);line-height:1.85;background:var(--bg-soft);padding:14px;border-radius:var(--r-m)">' + UI.esc(e.text) + '</div></div>' +
      '<div class="field"><div class="label">信号</div><div style="display:flex;flex-wrap:wrap;gap:6px">' + (e.signals||[]).map(s => '<span class="badge ' + s.cat + '">' + s.key + ' · ' + UI.esc(s.src) + '</span>').join('') + '</div></div>' +
      '<div class="field"><div class="label">评分</div><div style="font-family:var(--mono);font-size:12px">' + Object.keys(e.score).map(k => k + '=' + e.score[k].toFixed(1)).join(' · ') + '</div></div>',
      null);

    setTimeout(() => document.getElementById('modal-ok').style.display = '', 0);

  function editEntry(id){
    const e = entryService.findById(id);
    if (!e) return;
    UI.modal.open('编辑日记',
      '<div class="field"><div class="label">日期</div><input type="date" id="ed-date" value="' + e.date + '"/></div>' +
      '<div class="field"><div class="label">内容</div><textarea id="ed-text">' + UI.esc(e.text) + '</textarea></div>' +

  // —— 实时高亮渲染（按因子/维度分类）
  function renderHighlight(text){
    const target = document.getElementById('ai-highlight');
    if (!text || !text.trim()){ target.innerHTML = '<div class="hint">原文实时预览（命中的关键词会高亮）</div>'; return; }
    const rules = ruleService.getAll();
    const signals = Domain.extractSignals(text, rules);
    if (signals.length === 0){ target.textContent = text; return; }

    // 收集所有匹配的关键词（去重 + 标注维度）
    const matches = [];
    const seen = new Set();
    signals.forEach(s => {
      if (!seen.has(s.src)){
        seen.add(s.src);
        matches.push({ word: s.src, cat: s.cat, key: s.key, factorName: s.factorName });
      }
    });
    // 按关键词长度倒序匹配，避免子串问题
    matches.sort((a,b) => b.word.length - a.word.length);

    // 构造转义后的 HTML，对每个关键词做高亮
    let html = UI.esc(text);
    matches.forEach(m => {
      const safeWord = m.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp(safeWord, 'g');
      html = html.replace(re, '<span class="hl-' + m.cat + '"><span class="hl-cat">' + m.key + '</span>' + UI.esc(m.word) + '</span>');
    });
    target.innerHTML = html;
  }

  function renderAIResults(){
    const r = lastAIRun;
    const ids = ['d1','d2','d3','s1','s2','s3','t1','t2','t3'];
    if (!r){
      ids.forEach(id => document.getElementById('ai-' + id).textContent = '—');
      document.getElementById('ai-conf').textContent = '—';
      document.getElementById('ai-signal-count').textContent = '0';
      document.getElementById('ai-signals').innerHTML = '<div style="color:var(--ink-faint);font-size:var(--fs-sm);padding:8px">点击「▶ 抽取」开始分析。</div>';
      return;
    }
    Object.keys(r.score).forEach(k => document.getElementById('ai-' + k.toLowerCase()).textContent = r.score[k].toFixed(1));
    document.getElementById('ai-conf').textContent = '置信度 ' + r.confidence + '%';
    document.getElementById('ai-signal-count').textContent = r.signals.length;
    // 按 factor 聚合显示（每个因子显示一次，归类到对应维度）
    const byFactor = {};
    r.signals.forEach(s => {
      const key = s.factorId || ('_legacy_' + s.key);
      if (!byFactor[key]) byFactor[key] = { ...s, count:0 };
      byFactor[key].count++;
    });
    const grouped = Object.values(byFactor).sort((a,b) => (b.weight||0) - (a.weight||0));
    document.getElementById('ai-signals').innerHTML = grouped.length === 0
      ? '<div style="color:var(--ink-faint);font-size:var(--fs-sm);padding:8px">未命中任何信号关键词。可在「指标规则 → 因子」中添加。</div>'
      : grouped.map(s => {
          const factorLabel = s.factorName ? s.factorName : s.key;
          const countLabel = s.count > 1 ? ' <span style="color:var(--accent);font-weight:600">×' + s.count + '</span>' : '';
          const negBadge = s.negated ? ' <span style="background:oklch(60% 0.140 45 / .12);color:var(--warm);font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px">已否定</span>' : '';
          const modBadge = s.modifierWord ? ' <span style="background:var(--bg-soft);color:var(--ink-soft);font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px">' + UI.esc(s.modifierWord) + '</span>' : '';
          const conf = typeof s.confidence === 'number' ? s.confidence : 1;
          const confLabel = conf >= 1.3 ? '强' : (conf >= 0.9 ? '中' : '弱');
          const infoIcon = s.factorId ? UI.factorInfoHTML({ id: s.factorId, name: factorLabel }) : '';
          return '<div class="ai-signal"><span class="src"><span class="badge ' + s.cat + '" style="margin-right:6px">' + s.key + '</span>' + UI.esc(factorLabel) + infoIcon + ' · ' + UI.esc(s.src) + countLabel + negBadge + modBadge + '</span><span class="conf">' + confLabel + ' <b>' + (s.weight||1).toFixed(2) + '</b></span></div>';
        }).join('');
  }
