  // —— 5 个观察指标 + 画像类型 + 相关性 + 异常 + 时间模式 + 因子热度
  function renderObservations(data){
    const wrap = document.getElementById('view-workbench');
    if (!wrap || !wrap.classList.contains('active')) return;

    // 派生指标
    let obsCard = wrap.querySelector('.derived-card');
    if (!obsCard){
      obsCard = document.createElement('div');
      obsCard.className = 'derived-card';
      obsCard.innerHTML = '<h3 style="font-family:var(--serif);font-size:var(--fs-xl);font-weight:600;margin:16px 0 4px">5 个观察指标</h3><div class="sub" style="font-size:var(--fs-xs);color:var(--ink-faint);font-family:var(--mono);margin-bottom:14px">由维度聚合分数计算 · 综合反映近期时间结构</div><div class="derived-grid"></div>';
      wrap.appendChild(obsCard);
    }
    const obs = data.observations;
    // 维度 key → 维度显示名映射
    const dimToKey = { timeCompression:['D2','D3','T1'], experienceDensity:['D3','T1'], resultOrientation:['S1','S2'], lifeParticipation:['S3','T1','T2'], timeTrace:['T1','T2','T3'] };
    const tiles = [
      { key:'timeCompression', name:'时间压缩度', formula:'D2 × 0.4 + (10-D3) × 0.3 + (10-T1) × 0.3', v:obs.timeCompression, desc:'过去一段时间是否容易被压缩成模糊的"过去"', hot: obs.timeCompression > 7 },
      { key:'experienceDensity', name:'体验密度', formula:'D3 × 0.5 + T1 × 0.5', v:obs.experienceDensity, desc:'单位时间内产生多少具有区分度的体验节点', hot: obs.experienceDensity > 7 },
      { key:'resultOrientation', name:'结果化程度', formula:'S1 × 0.5 + S2 × 0.5', v:obs.resultOrientation, desc:'当前生活有多大比例被目标和结果牵引', hot: obs.resultOrientation > 7 },
      { key:'lifeParticipation', name:'生命参与度', formula:'S3 × 0.35 + T1 × 0.3 + T2 × 0.35', v:obs.lifeParticipation, desc:'自己有多少真正参与了正在发生的事情', hot: obs.lifeParticipation < 4 ? false : false, cool: obs.lifeParticipation < 4 },
      { key:'timeTrace', name:'时间留痕度', formula:'T1 × 0.3 + T2 × 0.35 + T3 × 0.35', v:obs.timeTrace, desc:'过去的时间在记忆/认知/关系里留下了多少东西' },
    ];
    const rules = ruleService.getAll();
    obsCard.querySelector('.derived-grid').innerHTML = tiles.map(t => {
      // v1.2: 计算每个观察指标的 Top 贡献因子
      const contribs = [];
      dimToKey[t.key].forEach(dimKey => {
        const dimRule = rules.find(r => r.key === dimKey);
        const factorAgg = data.dimAggregation && data.factorAggregation ? data.factorAggregation : {};
        const top = Domain.deriveFactorContributions(dimKey, factorAgg, rules, 1);
        if (top.length > 0) contribs.push({ dimKey, contrib: top[0] });
      });

          }).join('') + '</div>'
        : '<div class="contributors empty">样本不足</div>';
      return `
      <div class="derived-tile ${t.hot?'hot':''} ${t.cool?'cool':''}">
        <div class="name">${t.name}</div>
        <div class="formula">${t.formula}</div>

          t.primary.name === '探索型' ? '你处于持续探索模式，新体验多但关系容易断裂。试着把新发现沉淀下来。' :

    // 时间模式热力图

    const dayNames = ['日','一','二','三','四','五','六'];
    const tp = data.timePattern;
    if (tp && tp.heatmap && tp.heatmap.length > 0){
      const maxWeek = Math.max(...tp.heatmap.map(h => h.weekIdx));
      const maxScore = Math.max(...tp.heatmap.map(h => h.scoreSum / Math.max(h.count, 1)), 0.01);
      let gridHtml = '<div class="heatmap">';
      gridHtml += '<div></div>';
      for (let i = 0; i < 7; i++) gridHtml += '<div class="d-label">周' + dayNames[i] + '</div>';
      for (let w = 0; w <= maxWeek; w++){
        gridHtml += '<div class="h-label">第' + (w+1) + '周</div>';
        for (let d = 0; d < 7; d++){
          const cell = tp.heatmap.find(c => c.weekIdx === w && c.dow === d);
          if (!cell){ gridHtml += '<div class="cell"></div>'; continue; }
          const score = cell.scoreSum / Math.max(cell.count, 1);
          const ratio = score / maxScore;
          let cls = '';
          if (ratio > 0.75) cls = 'l5';
          else if (ratio > 0.55) cls = 'l4';
          else if (ratio > 0.35) cls = 'l3';
          else if (ratio > 0.15) cls = 'l2';
          else cls = 'l1';
          gridHtml += '<div class="cell ' + cls + '" title="第' + (w+1) + '周·周' + dayNames[d] + ' · 综合分 ' + score.toFixed(1) + ' · 共 ' + cell.count + ' 条"></div>';
        }

      gridHtml += '</div>';
      gridHtml += '<div class="heatmap-legend">低 <div class="scale"><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span><span class="cell l5"></span></div> 高 <span style="margin-left:auto">高峰：<b>' + tp.peakDayLabel + '</b> · 周期性：<b>' + (tp.periodicity * 100).toFixed(0) + '%</b></span></div>';

    } else {

        corrs.map(c => {

            '<div class="corr-pair"><span class="badge ' + (c.a.startsWith('D')?'D':c.a.startsWith('S')?'S':'T') + '">' + c.a + '</span>' +
            '<span class="arr">' + (isPos ? '↔' : '↮') + '</span>' +
            '<span class="badge ' + (c.b.startsWith('D')?'D':c.b.startsWith('S')?'S':'T') + '">' + c.b + '</span></div>' +
            '<span class="corr-arrow ' + (isPos?'pos':'neg') + '">' + (isPos ? '正相关' : '负相关') + '</span>' +
            '<span class="corr-r">' + (c.r > 0 ? '+' : '') + c.r + '</span>' +

        }).join('') +

    // 异常日记
    let anomCard = wrap.querySelector('.anomaly-card');
    if (!anomCard){
      anomCard = document.createElement('div');
      anomCard.className = 'anomaly-card';
      wrap.appendChild(anomCard);
    }

    if (anoms.length === 0){
      anomCard.innerHTML = '<h3>异常日记检测</h3><div class="sub" style="font-size:var(--fs-xs);color:var(--ink-faint);font-family:var(--mono);margin-bottom:14px">与近期画像偏离度最大的日子</div><div style="padding:14px;background:var(--bg-soft);border-radius:var(--r-m);color:var(--ink-faint);font-size:var(--fs-sm);text-align:center">近期没有显著偏离的日子 ✨</div>';
    } else {
      anomCard.innerHTML = '<h3>异常日记检测</h3><div class="sub" style="font-size:var(--fs-xs);color:var(--ink-faint);font-family:var(--mono);margin-bottom:14px">与近期画像偏离度最大的 5 天</div><div class="anomaly-list">' +
        anoms.map(a => '<div class="anomaly-row"><span class="d">' + a.entry.date + '</span><span class="tx">' + UI.esc(a.entry.text) + '</span><span class="dev">Δ ' + a.devScore + '</span></div>').join('') +
        '</div>';

    // 因子热度排行
    let heatR = wrap.querySelector('.heat-card');
    if (!heatR){
      heatR = document.createElement('div');
      heatR.className = 'heat-card';
      wrap.appendChild(heatR);
    }
    const heat = data.factorHeat || [];
    if (heat.length === 0){
      heatR.innerHTML = '<h3>因子热度 TOP 10</h3><div style="padding:14px;background:var(--bg-soft);border-radius:var(--r-m);color:var(--ink-faint);font-size:var(--fs-sm);text-align:center">暂无因子命中记录</div>';
    } else {
      heatR.innerHTML = '<h3>因子热度 TOP 10</h3><div class="heat-grid">' +
        heat.slice(0, 10).map((f, i) => '<div class="heat-row"><span class="rank">#' + (i+1) + '</span><span class="nm"><span class="badge ' + f.cat + '">' + f.dim + '</span>' + UI.esc(f.name) + '</span><span class="cnt">' + f.count + '</span></div>').join('') +
        '</div>';

  function renderRadar(agg){
    const dims = ['D1','D2','D3','S1','S2','S3','T1','T2','T3'];
    const R = 200;
    const ang = (i) => -Math.PI/2 + (i * 2 * Math.PI / dims.length);
    const pt = (i, r) => [Math.cos(ang(i)) * r, Math.sin(ang(i)) * r];
    const rings = [0.25, 0.5, 0.75, 1].map(t => {
      const pts = dims.map((_, i) => pt(i, R * t).map(n => n.toFixed(2)).join(',')).join(' ');
      return '<polygon points="' + pts + '" fill="none" stroke="oklch(89% 0.012 85)" stroke-width="' + (t === 1 ? 1.1 : 0.6) + '"/>';
    }).join('');
    const axes = dims.map((_, i) => { const p = pt(i, R); return '<line x1="0" y1="0" x2="' + p[0].toFixed(2) + '" y2="' + p[1].toFixed(2) + '" stroke="oklch(89% 0.012 85)" stroke-width="0.5"/>'; }).join('');
    const labels = dims.map((d, i) => {
      const p = pt(i, R + 20);
      const anchor = p[0] < -8 ? 'end' : (p[0] > 8 ? 'start' : 'middle');
      const color = d.startsWith('D') ? 'oklch(36% 0.072 168)' : (d.startsWith('S') ? 'oklch(36% 0.080 70)' : 'oklch(36% 0.080 280)');
      return '<text x="' + p[0].toFixed(2) + '" y="' + p[1].toFixed(2) + '" text-anchor="' + anchor + '" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="' + color + '" font-weight="500">' + d + '</text>';
    }).join('');
    const dataPts = dims.map((d, i) => pt(i, ((agg[d]||0) / 10) * R).map(n => n.toFixed(2)).join(',')).join(' ');
    const ptsCircles = dims.map((d, i) => { const p = pt(i, ((agg[d]||0) / 10) * R); return '<circle cx="' + p[0].toFixed(2) + '" cy="' + p[1].toFixed(2) + '" r="3.5" fill="oklch(98% 0.010 85)" stroke="oklch(30% 0.070 168)" stroke-width="1.5"/>'; }).join('');
    document.getElementById('wbRadar').innerHTML =
      '<defs><radialGradient id="wbFill" cx="50%" cy="50%" r="55%"><stop offset="0%" stop-color="oklch(44% 0.072 168)" stop-opacity="0.55"/><stop offset="100%" stop-color="oklch(70% 0.105 75)" stop-opacity="0.18"/></radialGradient></defs>' +
      rings + axes +
      '<polygon points="' + dataPts + '" fill="url(#wbFill)" stroke="oklch(30% 0.070 168)" stroke-width="1.6" stroke-linejoin="round"/>' +
      ptsCircles + labels;
  }

  // —— IE
  function bindIE(){
    const drop = document.getElementById('ie-drop');
    const file = document.getElementById('ie-file');
    drop.addEventListener('click', () => file.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragging'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('dragging'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    file.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });

    function handleFile(f){
      const r = new FileReader();
      r.onload = ev => {
        try {
          let parsed = ieService.parseFile(ev.target.result, f.name);
          // 检测是否是加密导出
          if (parsed && parsed._encrypted){
            const pwd = prompt('此文件已加密，请输入密码：');
            if (!pwd){ UI.toast('已取消导入','error'); return; }
            parsed = Domain.decryptExport(parsed, pwd);
            UI.toast('解密成功','success');
          }
          previewImport(Array.isArray(parsed) ? parsed : [parsed], f.name);
          document.getElementById('ie-last').textContent = '导入 ' + f.name.slice(0, 14);
        } catch(e){ UI.toast('解析失败：' + e.message, 'error'); }
      };
      r.readAsText(f, 'utf-8');
    }

    function previewImport(rows, fileName){
      if (rows.length === 0){ UI.toast('文件无数据','error'); return; }
      const headers = Object.keys(rows[0]);
      const knownFields = ['', 'date', 'text', 'id', 'mood', 'scenario', 'D1', 'D2', 'D3', 'S1', 'S2', 'S3', 'T1', 'T2', 'T3'];
      let html = '<div class="ie-preview"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><b>' + UI.esc(fileName) + '</b><span style="font-family:var(--mono);font-size:12px;color:var(--ink-faint)">' + rows.length + ' 行</span></div>' +
        '<table><thead><tr><th>原字段</th><th>映射到</th></tr></thead><tbody>';
      headers.forEach(h => {
        const hl = h.toLowerCase();
        let guessed = '';
        if (hl.indexOf('date') !== -1 || hl.indexOf('日期') !== -1) guessed = 'date';
        else if (hl.indexOf('text') !== -1 || hl.indexOf('内容') !== -1 || hl.indexOf('日记') !== -1) guessed = 'text';
        else if (/^[DS][123]$/i.test(h)) guessed = h.toUpperCase();
        html += '<tr><td style="font-family:var(--mono);font-size:11px">' + UI.esc(h) + '</td>' +
          '<td><select class="map-select" data-h="' + UI.esc(h) + '">' + knownFields.map(k => '<option value="' + k + '"' + (k === guessed ? ' selected' : '') + '>' + (k || '— 忽略 —') + '</option>').join('') + '</select></td></tr>';
      });
      html += '</tbody></table>';
      html += '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:var(--fs-sm);color:var(--ink-soft)">数据预览（前 5 行）</summary><div style="margin-top:8px;max-height:200px;overflow:auto"><table style="font-size:11px"><thead><tr>' + headers.map(h => '<th>' + UI.esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.slice(0, 5).map(r => '<tr>' + headers.map(h => '<td>' + UI.esc(String(r[h] || '').slice(0, 60)) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></details>';
      html += '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn btn-ghost btn-sm" id="imp-cancel">取消</button><button class="btn btn-primary btn-sm" id="imp-confirm">导入 ' + rows.length + ' 行</button></div></div>';
      document.getElementById('ie-preview-wrap').innerHTML = html;

      document.getElementById('imp-cancel').addEventListener('click', () => document.getElementById('ie-preview-wrap').innerHTML = '');
      document.getElementById('imp-confirm').addEventListener('click', async () => {
        const map = {};
        document.querySelectorAll('.map-select').forEach(s => { if (s.value) map[s.dataset.h] = s.value; });
        let imported = 0;
        for (const r of rows){
          const partial = { signals: [], score: {} };
          Object.keys(map).forEach(h => {
            const target = map[h], val = r[h];
            if (target === 'date') partial.date = String(val || '').slice(0, 10) || new Date().toISOString().slice(0,10);
            else if (target === 'text') partial.text = String(val || '');
            else if (target === 'mood') partial.mood = String(val || 'mixed');
            else if (target === 'scenario') partial.scenario = String(val || '');
            else if (/^[DST][123]$/.test(target)){ const n = parseFloat(val); if (!isNaN(n)) partial.score[target] = n; }
          });
          if (!partial.text) continue;
          if (!partial.date) partial.date = new Date().toISOString().slice(0,10);
          if (!partial.mood) partial.mood = 'mixed';
          await entryService.create(partial);
          imported++;
        }
        Store.setEntries(entryService.getAll());
        document.getElementById('ie-preview-wrap').innerHTML = '';
        UI.toast('成功导入 ' + imported + ' 条','success');
        updateIeSize();
      });
    }

    document.getElementById('btn-export-preview').addEventListener('click', () => {
      const { text } = ieService.export(getExportOptions());
      const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const w = window.open(url);
      if (!w) UI.toast('无法打开预览','error');
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    });
    document.getElementById('btn-export-download').addEventListener('click', () => {
      const opts = getExportOptions();
      const { text, format, encrypted } = ieService.export(opts);
      const ext = encrypted ? 'enc.' + format : format;
      const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'timetrace-export-' + new Date().toISOString().slice(0,10) + '.' + ext;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      document.getElementById('ie-last').textContent = encrypted ? '加密导出 ' + format.toUpperCase() : '导出 ' + format.toUpperCase();
      UI.toast(encrypted ? '已加密导出' : '已开始下载','success');
    });

    function getExportOptions(){
      const fmtEl = document.querySelector('input[name="exp-fmt"]:checked');
      const pwdEl = document.getElementById('exp-password');
      return {
        rules: document.getElementById('exp-rules').checked,
        entries: document.getElementById('exp-entries').checked,
        events: document.getElementById('exp-events').checked,
        scenarios: document.getElementById('exp-scenarios').checked,
        format: fmtEl ? fmtEl.value : 'json',
        password: pwdEl && pwdEl.value ? pwdEl.value : null
      };
    }
  }

    let active = 0;
    function render(filter){
      const q = (filter || '').toLowerCase();
      const filtered = COMMANDS.filter(c => !q || (c.title + ' ' + c.scope).toLowerCase().includes(q));
      if (filtered.length === 0){
        list.innerHTML = '<div class="cmdk-empty">未找到匹配命令</div>'; return;
      }
      list.innerHTML = filtered.map((c, i) => `
        <div class="cmdk-item${i === active ? ' active' : ''}" data-i="${i}">
          <span class="ic">${c.icon}</span>
          <span>${UI.esc(c.title)}</span>
          <span class="sc">${UI.esc(c.scope)}</span>
        </div>`).join('');
      list.querySelectorAll('.cmdk-item').forEach((el, i) => {
        el.addEventListener('click', () => { filtered[i].action(); close(); });
        el.addEventListener('mouseenter', () => { active = i; render(input.value); });
      });
    }

    function open(){
      back.classList.add('open');
      input.value = ''; active = 0; render('');
      setTimeout(() => input.focus(), 50);
    }
    function close(){ back.classList.remove('open'); }

    addEventListener('keydown', e => {
      const isMeta = e.metaKey || e.ctrlKey;
      if (isMeta && (e.key === 'k' || e.key === 'K')){
        e.preventDefault(); back.classList.contains('open') ? close() : open();
      }
      if (e.key === 'Escape' && back.classList.contains('open')) close();
      if (back.classList.contains('open')){
        if (e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(active + 1, list.querySelectorAll('.cmdk-item').length - 1); render(input.value); }
        if (e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(0, active - 1); render(input.value); }
        if (e.key === 'Enter'){
          e.preventDefault();
          const item = list.querySelector('.cmdk-item.active');
          if (item) item.click();
        }
      }
    });
    back.addEventListener('click', e => { if (e.target === back) close(); });
    input.addEventListener('input', () => { active = 0; render(input.value); });
  }

  // —— 因子分解可视化（在工作台底部）
  function renderFactorBreakdown(factorAgg){
    const wrap = document.getElementById('view-workbench');
    if (!wrap || !wrap.classList.contains('active')) return;
    wrap.querySelectorAll('.factor-card').forEach(el => el.remove());

    const rules = Store.getRules();
    const factorAggNonEmpty = factorAgg && Object.keys(factorAgg).length > 0;
    const card = document.createElement('div');
    card.className = 'factor-card';
    card.innerHTML = '<h3>因子贡献分解 · 二级因子层</h3><div class="sub">每个维度下的细粒度因子得分</div><div id="factor-breakdown-body"></div>';
    wrap.appendChild(card);
    const body = card.querySelector('#factor-breakdown-body');

    if (!factorAggNonEmpty){
      body.innerHTML = '<div class="factor-empty">当前时间窗内暂无因子数据。新增日记后此处会展示每个二级因子的贡献。</div>';
      return;
    }

    body.innerHTML = rules.map(r => {
      if (!r.factors || r.factors.length === 0) return '';
      const enabledFactors = r.factors.filter(f => f.enabled);
      if (enabledFactors.length === 0) return '';
      const total = enabledFactors.reduce((s, f) => s + (factorAgg[f.id] || 0), 0) / Math.max(enabledFactors.length, 1);
      return '<div class="factor-dim">' +
        '<div class="factor-dim-head">' +
          '<span class="lbl"><span class="badge ' + r.cat + '">' + r.cat + '</span>' + r.key + ' · ' + UI.esc(r.name) + '</span>' +
          '<span class="total">综合 ' + total.toFixed(1) + ' · ' + enabledFactors.length + ' 因子</span>' +
        '</div>' +
        '<div class="factor-bars">' +
          enabledFactors.map(f => {
            const v = factorAgg[f.id] || 0;
            const cls = v >= 7 ? 't-high' : v >= 4 ? 't-mid' : 't-low';
            return '<div class="factor-bar-row">' +
              '<span class="nm"><span class="status-dot on"></span>' + UI.esc(f.name) + UI.factorInfoHTML({id:f.id, name:f.name, desc:f.desc||'', signals:f.signals||[], intent:f.intent||'neutral', dimKey:r.key}) + '</span>' +
              '<div class="bar ' + cls + '"><span style="width:' + (v*10) + '%"></span></div>' +
              '<span class="v">' + v.toFixed(1) + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>';
    }).filter(Boolean).join('') || '<div class="factor-empty">暂无因子数据。</div>';

    // 触发动画
    setTimeout(() => body.querySelectorAll('.bar').forEach(b => b.classList.add('show')), 50);
  }

  function renderTrendChart(svg, legend, entries){
    const W = 800, H = 220, pad = { l:40, r:20, t:20, b:30 };
    const dimNames = {D1:'时间投入',D2:'时间重复',D3:'新事件',S1:'未来导向',S2:'结果导向',S3:'主体参与',T1:'体验留痕',T2:'认知变化',T3:'关系连接'};
    const colors = {D:'oklch(44% 0.072 168)',S:'oklch(70% 0.105 75)',T:'oklch(56% 0.080 280)'};
    const sorted = entries.slice().sort((a,b) => a.date.localeCompare(b.date));
    const n = sorted.length;

    const grid = [0, 2.5, 5, 7.5, 10];
    let svgHtml = '';
    grid.forEach(v => {
      const y = pad.t + (H - pad.t - pad.b) * (1 - v / 10);
      svgHtml += `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="oklch(89% 0.012 85)" stroke-width="0.5" stroke-dasharray="2 4"/>`;
      svgHtml += `<text x="${pad.l - 6}" y="${y + 4}" text-anchor="end" font-family="JetBrains Mono" font-size="10" fill="oklch(60% 0.010 235)">${v}</text>`;
    });

    const xAt = i => pad.l + (W - pad.l - pad.r) * (i / Math.max(1, n - 1));
    const yAt = v => pad.t + (H - pad.t - pad.b) * (1 - v / 10);

    const dims = ['D1','D2','D3','S1','S2','S3','T1','T2','T3'];
    dims.forEach(d => {
      const pts = sorted.map((e, i) => xAt(i) + ',' + yAt((e.score && e.score[d]) || 0)).join(' ');
      const color = d.startsWith('D') ? colors.D : (d.startsWith('S') ? colors.S : colors.T);
      svgHtml += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.2" opacity="0.65"/>`;
      sorted.forEach((e, i) => {
        const v = (e.score && e.score[d]) || 0;
        svgHtml += `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="2.5" fill="${color}" opacity="0.85"/>`;
      });
    });

    // x 轴标签（只显示首尾和中间）
    [0, Math.floor(n/2), n-1].forEach(i => {
      svgHtml += `<text x="${xAt(i)}" y="${H - 10}" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="oklch(60% 0.010 235)">${sorted[i].date.slice(5)}</text>`;
    });

    svg.innerHTML = svgHtml;

    legend.innerHTML =
      '<span><span class="dot" style="background:' + colors.D + '"></span>D · 发生</span>' +
      '<span><span class="dot" style="background:' + colors.S + '"></span>S · 结构</span>' +
      '<span><span class="dot" style="background:' + colors.T + '"></span>T · 留痕</span>' +
      '<span style="margin-left:auto">' + n + ' 条记录 · 9 维叠加</span>';
  }

  function renderDistChart(rowsEl, entries){
    const dimNames = {D1:'时间投入',D2:'时间重复',D3:'新事件',S1:'未来导向',S2:'结果导向',S3:'主体参与',T1:'体验留痕',T2:'认知变化',T3:'关系连接'};
    const counts = {D1:0,D2:0,D3:0,S1:0,S2:0,S3:0,T1:0,T2:0,T3:0};
    entries.forEach(e => {
      (e.signals || []).forEach(s => { if (counts[s.key] !== undefined) counts[s.key]++; });
    });
    const total = Object.values(counts).reduce((s,v) => s+v, 0) || 1;
    const colors = {D:'oklch(44% 0.072 168)',S:'oklch(70% 0.105 75)',T:'oklch(56% 0.080 280)'};
    rowsEl.innerHTML = Object.keys(counts).map(k => {
      const c = counts[k];
      const pct = (c / total * 100).toFixed(1);
      const color = k.startsWith('D') ? colors.D : (k.startsWith('S') ? colors.S : colors.T);
      return '<div class="dist-row">' +
        '<span class="lbl"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:' + color + ';margin-right:6px"></span>' + k + ' · ' + dimNames[k] + '</span>' +
        '<div class="bar"><span style="width:' + pct + '%;background:' + color + '"></span></div>' +
        '<span class="pct">' + c + ' / ' + pct + '%</span>' +
      '</div>';
    }).join('');
  }

  // ============================================================
   // 增强功能 4 · 批量操作（多选 + 批量删除）
   // ============================================================
  let selectedIds = new Set();

  function toggleSelect(id){
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    renderEntriesTable();
    renderBatchBar();
  }
  function renderBatchBar(){
    const bar = document.getElementById('batch-bar');
    if (!bar) return;
    if (selectedIds.size === 0){ bar.remove(); return; }
    bar.innerHTML = '<span class="sel-count">' + selectedIds.size + ' 条已选</span>' +
      '<span style="color:var(--ink-soft)">·</span>' +
      '<button class="btn btn-ghost btn-sm" id="batch-clear">取消选择</button>' +
      '<button class="btn btn-danger btn-sm" id="batch-del">批量删除</button>' +
      '<button class="btn btn-accent btn-sm" id="batch-export">导出所选</button>';
    bar.querySelector('#batch-clear').addEventListener('click', () => { selectedIds.clear(); renderEntriesTable(); renderBatchBar(); });
    bar.querySelector('#batch-del').addEventListener('click', async () => {
      if (!confirm('确认删除选中的 ' + selectedIds.size + ' 条？')) return;
      for (const id of selectedIds){ await entryService.remove(id); }
      selectedIds.clear();
      Store.setEntries(entryService.getAll());
      UI.toast('批量删除完成','success');
    });
    bar.querySelector('#batch-export').addEventListener('click', () => {
      const sel = Store.getEntries().filter(e => selectedIds.has(e.id));
      const blob = new Blob([JSON.stringify({entries:sel, _meta:{exportedAt:new Date().toISOString()}}, null, 2)], { type:'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url;
      a.download = 'timetrace-selected-' + sel.length + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      UI.toast('已导出 ' + sel.length + ' 条','success');
    });
  }

  // —— 暴露 toggleSelect 给表格使用
  // （事件已在 renderEntriesTable 内绑定，无需全局挂载）

  // ============================================================
  // Domain 单元测试（运行时验证所有核心算法）
  // ============================================================
  function runDomainTests(){
    const results = [];
    const test = (name, fn) => {
      try { const r = fn(); results.push({ name, pass: r === true || (r && r.pass !== false), detail: r && r.detail || '' }); }
      catch(e){ results.push({ name, pass: false, detail: e.message }); }
    };

    // 1. extractSignals：原文应能命中多个因子
    test('extractSignals 命中关键词', () => {
      const rules = Store.getRules();
      const text = '今天第一次去了一家新开的咖啡馆，味道很好。突然明白了我以前的想法有问题。';
      const sigs = Domain.extractSignals(text, rules);
      return sigs.length >= 4 ? true : { pass:false, detail:'只命中 ' + sigs.length };
    });

    // 2. scoreFromSignals：分值在 0-10 之间
    test('scoreFromSignals 范围正确', () => {
      const rules = Store.getRules();
      const sigs = Domain.extractSignals('第一次尝试，味道挺好吃，主动选择', rules);
      const score = Domain.scoreFromSignals(sigs, rules);
      const ok = Object.values(score.dimScore).every(v => v >= 0 && v <= 10);
      return ok ? true : { pass:false, detail:'分值越界' };
    });

    // 3. aggregateProfile：35 条种子数据应能聚合出非零分
    test('aggregateProfile 35 条种子', () => {
      const rules = Store.getRules();
      const entries = Store.getEntries();
      const agg = Domain.aggregateProfile(entries, rules, 'all');
      const total = Object.values(agg.dimAggregation).reduce((s,v) => s+v, 0);
      return total > 0 ? true : { pass:false, detail:'聚合为 0' };
    });

    // 4. deriveAllObservations：5 个指标都在 0-10
    test('deriveAllObservations 5 指标', () => {
      const agg = Domain.aggregateProfile(Store.getEntries(), Store.getRules(), 'all');
      const obs = Domain.deriveAllObservations(agg.dimAggregation);
      const ks = ['timeCompression','experienceDensity','resultOrientation','lifeParticipation','timeTrace'];
      return ks.every(k => typeof obs[k] === 'number' && obs[k] >= 0 && obs[k] <= 10);
    });

    // 5. classifyProfileStructure：必须返回 3 个类型
    test('classifyProfileStructure 3 类型', () => {
      const agg = Domain.aggregateProfile(Store.getEntries(), Store.getRules(), 'all');
      const cls = Domain.classifyProfileStructure(agg.dimAggregation);
      return cls.scores.length === 3 && cls.primary ? true : { pass:false };
    });

    // 6. correlateDimensions：35 条数据应有相关对
    test('correlateDimensions 找到相关对', () => {
      const corrs = Domain.correlateDimensions(Store.getEntries());
      return Array.isArray(corrs) ? true : { pass:false };
    });

    // 7. analyzeTimePattern：周内平均数 = 7 个
    test('analyzeTimePattern 周内 7 项', () => {
      const p = Domain.analyzeTimePattern(Store.getEntries());
      return p.weekdayAverages.length === 7 ? true : { pass:false };
    });

    // 8. rankFactorHeat：应返回因子数组
    test('rankFactorHeat 返回数组', () => {
      const h = Domain.rankFactorHeat(Store.getEntries(), Store.getRules());
      return Array.isArray(h);
    });

    // 9. detectAnomalies：可能为空但不应抛错
    test('detectAnomalies 不抛错', () => {
      const a = Domain.detectAnomalies(Store.getEntries(), Domain.aggregateProfile(Store.getEntries(), Store.getRules(), 'all').dimAggregation);
      return Array.isArray(a);
    });

    // 10. flattenFactors：应含 56 个因子（精确）
    test('flattenFactors === 56', () => {
      const f = Domain.flattenFactors(Store.getRules());
      return f.length === 56 ? true : { pass:false, detail:'实际 ' + f.length + ' 个，应为 56' };
    });

    // 11. clamp 函数
    test('clamp 边界正确', () => {
      return Domain.clamp(-5, 0, 10) === 0 && Domain.clamp(15, 0, 10) === 10 && Domain.clamp(5, 0, 10) === 5;
    });

    // 12. 数据迁移往返
    test('migrateData 兼容性', () => {
      const old = { rules: [{key:'D1',cat:'D',name:'test',q:'?',desc:'',weight:0.5,threshold:0.3,signals:['test']}], entries: [], scenarios: [] };
      const migrated = Domain.migrateData(old);
      return migrated._schemaVersion === '1.1' && migrated._migratedAt ? true : { pass:false };
    });

    // 13. extractSignals 否定识别
    test('extractSignals 否定词取消命中', () => {
      const rules = Store.getRules();
      const sigs = Domain.extractSignals('今天没工作，休息了一整天', rules);
      const workHit = sigs.find(s => s.factorId === 'D1-W');
      return workHit && workHit.negated === true ? true : { pass:false, detail:'未检测到"没工作"的否定' };
    });

    // 14. extractSignals 强度修饰
    test('extractSignals 强度修饰符生效', () => {
      const rules = Store.getRules();
      const sigs1 = Domain.extractSignals('很焦虑', rules);
      const sigs2 = Domain.extractSignals('焦虑', rules);
      const s1 = sigs1.find(s => s.factorId === 'S1-AN');
      const s2 = sigs2.find(s => s.factorId === 'S1-AN');
      return s1 && s2 && s1.confidence > s2.confidence ? true : { pass:false, detail:'非常/普通无差异' };
    });

    // 15. 因子数 === 56（精确）
    test('flattenFactors === 56', () => {
      const f = Domain.flattenFactors(Store.getRules());
      return f.length === 56 ? true : { pass:false, detail:'实际 ' + f.length + ' 个，应为 56' };
    });

    // 16. clamp 函数
    test('clamp 边界正确', () => {
      return Domain.clamp(-5, 0, 10) === 0 && Domain.clamp(15, 0, 10) === 10 && Domain.clamp(5, 0, 10) === 5;
    });

    // 17. 数据迁移往返
    test('migrateData 升级到 1.1', () => {
      const old = { _schemaVersion:'1.0', rules:[{key:'D1',cat:'D',name:'t',q:'?',desc:'',weight:0.5,threshold:0.3,signals:['t'],factors:[{id:'D1-T',name:'t',signals:['t'],weight:1,enabled:true}]}], entries:[], scenarios:[] };
      const migrated = Domain.migrateData(old);
      return migrated._schemaVersion === '1.1' && migrated.rules[0].factors[0].intent !== undefined ? true : { pass:false };
    });

    // 18. trimmedMean 抗离群
    test('trimmedMean 抗离群值', () => {
      const vals = [5,5,5,5,5,5,5,100];
      const mean = vals.reduce((s,v)=>s+v,0)/vals.length;
      const tm = Domain.trimmedMean(vals, 0.1);
      return Math.abs(tm - 5) < Math.abs(mean - 5) ? true : { pass:false, detail:'trimmedMean=' + tm.toFixed(2) + ', mean=' + mean.toFixed(2) };
    });

    // 19. aggregateProfile 含 trend 字段
    test('aggregateProfile 含 trend', () => {
      const rules = Store.getRules();
      const entries = Store.getEntries();
      const agg = Domain.aggregateProfile(entries, rules, '7');
      if (agg.sampleSize === 0) return true; // 没数据不强求
      return agg.trend && typeof agg.trend === 'object' ? true : { pass:false };
    });

    // 20. S2/S3 负向 intent + 否定 → 不扣分
    test('负向 intent 否定识别', () => {
      const rules = Store.getRules();
      const sigs = Domain.extractSignals('不再焦虑，不再担心，今天不卷效率', rules);
      const anHit = sigs.find(s => s.factorId === 'S1-AN');
      const efHit = sigs.find(s => s.factorId === 'S2-EF');
      return (anHit && anHit.negated) && (efHit && efHit.negated) ? true : { pass:false, detail:'否定信号未识别' };
    });

    // 21. 复合词宽松匹配（looseMatch）：开会 vs 开了一个会议
    test('looseMatch 复合词被助词隔开', () => {
      const rules = Store.getRules();
      const sigs = Domain.extractSignals('我开了一个会议，加了三天班', rules);
      const w = sigs.find(s => s.factorId === 'D1-W');
      return w ? true : { pass:false, detail:'复合词未命中' };
    });

    // 22. 否定不卷 + 工作
    test('「不卷工作」触发否定', () => {
      const rules = Store.getRules();
      const sigs = Domain.extractSignals('今天不卷工作了', rules);
      const w = sigs.find(s => s.factorId === 'D1-W');
      return w && w.negated && w.negatedWord === '不卷' ? true : { pass:false, detail:'否定未识别' };
    });

    // 23. 同一因子不被双重 hit（loose + exact）
    test('同因子 loose+exact 不重复', () => {
      const rules = Store.getRules();
      const sigs = Domain.extractSignals('今天开了个会', rules);
      const w = sigs.filter(s => s.factorId === 'D1-W');
      return w.length === 1 ? true : { pass:false, detail:'命中了 ' + w.length + ' 次' };
    });

    // 24. createFactor 工厂包含 v1.1 字段
    test('createFactor 字段完整', () => {
      const f = Domain.createFactor({ id:'TEST', name:'t', signals:['a','b'], weight:0.5, enabled:true });
      const ok = f.id === 'TEST' && f.intent === 'neutral' && Array.isArray(f.negations) && Array.isArray(f.modifiers);
      return ok ? true : { pass:false, detail:'缺 v1.1 字段' };
    });

    // 25. createFactor intent 校验
    test('createFactor intent 校验', () => {
      const f1 = Domain.createFactor({ id:'T1', intent:'positive' });
      const f2 = Domain.createFactor({ id:'T2', intent:'invalid_value' });
      return f1.intent === 'positive' && f2.intent === 'neutral' ? true : { pass:false };
    });

    // 26. 相邻 / 链式合并
    test('链式相邻合并', () => {
      const rules = Store.getRules();
      const sigs = Domain.extractSignals('工作工作工作', rules);
      const w = sigs.filter(s => s.factorId === 'D1-W');
      return w.length === 1 ? true : { pass:false, detail:'工作×3 应合并为 1 hit，实际 ' + w.length };
    });

    // 27. 跨位置保留多 hit
    test('跨位置保留多 hit', () => {
      const rules = Store.getRules();
      const sigs = Domain.extractSignals('今天工作，明天工作', rules);
      const w = sigs.filter(s => s.factorId === 'D1-W');
      return w.length === 2 ? true : { pass:false, detail:'今天工作，明天工作 应为 2 hit，实际 ' + w.length };
    });

    // 28. 极长文本性能
    test('极长文本性能 < 500ms', () => {
      const rules = Store.getRules();
      const big = '工作'.repeat(2000);
      const t0 = Date.now();
      const sigs = Domain.extractSignals(big, rules);
      const t1 = Date.now();
      const w = sigs.filter(s => s.factorId === 'D1-W');
      return (t1-t0) < 500 && w.length < 10 ? true : { pass:false, detail:'耗时 ' + (t1-t0) + 'ms, ' + w.length + ' hits' };
    });

    // 29. h 被已有 hit 包含则不重复加
    test('包含检查避免重复', () => {
      const rules = Store.getRules();
      const sigs = Domain.extractSignals('我开了一个会议，加了三天班', rules);
      const w = sigs.filter(s => s.factorId === 'D1-W');
      // 开会/会议 合并为 1，加班 1，总共 2
      return w.length === 2 ? true : { pass:false, detail:'实际 ' + w.length + ' hits' };
    });

    // 30. computeStreak：连续 7 天
    test('computeStreak 连续 7 天', () => {
      const entries = Array.from({length:7}, (_,i) => ({date:'2026-09-'+(15+i).toString().padStart(2,'0')}));
      const s = Domain.computeStreak(entries, '2026-09-21');
      return s.current === 7 && s.longest === 7 ? true : { pass:false, detail:'current=' + s.current };
    });

    // 31. computeStreak：间断最长 = 3
    test('computeStreak 间断 longest', () => {
      const entries = [
        {date:'2026-09-15'},{date:'2026-09-16'},{date:'2026-09-17'},
        {date:'2026-09-20'},{date:'2026-09-21'},
      ];
      const s = Domain.computeStreak(entries, '2026-09-21');
      return s.current === 2 && s.longest === 3 ? true : { pass:false, detail:'current=' + s.current + ' longest=' + s.longest };
    });

    // 32. deriveFactorContributions 排序
    test('deriveFactorContributions Top N 排序', () => {
      const fac = {'D1-W':8,'D1-L':5,'D1-F':3,'D1-S':2};
      const c = Domain.deriveFactorContributions('D1', fac, Store.getRules(), 3);
      const ok = c.length === 3 && c[0].factorId === 'D1-W' && c[1].factorId === 'D1-L' && c[2].factorId === 'D1-F';
      return ok ? true : { pass:false, detail:'顺序错' };
    });

    // 33. buildCalendarData 返回 53×7
    test('buildCalendarData 网格', () => {
      const data = Domain.buildCalendarData([{date:'2026-09-21'}], 53);
      return data.length === 53 && data[0].length === 7 ? true : { pass:false };
    });

    // 34. searchEntries
    test('searchEntries 全文搜索', () => {
      const entries = [
        {date:'2026-09-20', text:'今天开会了', signals:[]},
        {date:'2026-09-21', text:'今天不开会，去散步', signals:[]},
      ];
      const r = Domain.searchEntries(entries, '开会');
      return r.length === 2 ? true : { pass:false };
    });

    // 35. searchEntries 空查询
    test('searchEntries 空查询', () => {
      return Domain.searchEntries([], '').length === 0 ? true : { pass:false };
    });

    return results;
  }

  // —— v1.2 · 全局搜索模态框
  function openSearchModal(){
    const entries = entryService.getAll();
    const html = `
      <div class="search-modal-body">
        <div class="search-input-row">
          <input type="text" id="search-input" placeholder="搜索日记全文（支持中文）" autocomplete="off"/>
        </div>
        <div class="search-results" id="search-results">
          <div class="search-empty">输入关键词开始搜索 · ${entries.length} 条日记可搜</div>
        </div>
      </div>
    `;
    UI.modal.open('搜索日记', html, null);
    document.getElementById('modal-ok').style.display = 'none';
    setTimeout(() => document.getElementById('modal-cancel').textContent = '关闭', 0);

    const input = document.getElementById('search-input');
    const resultsEl = document.getElementById('search-results');
    function doSearch(){
      const q = input.value.trim();
      if (!q){
        resultsEl.innerHTML = '<div class="search-empty">输入关键词开始搜索 · ' + entries.length + ' 条日记可搜</div>';
        return;
      }
      const results = Domain.searchEntries(entries, q);
      if (results.length === 0){
        resultsEl.innerHTML = '<div class="search-empty">未找到包含「' + UI.esc(q) + '」的日记</div>';
        return;
      }
      resultsEl.innerHTML = '<div class="search-counter">命中 ' + results.length + ' 条</div>' +
        results.map(r => {
          const highlighted = UI.esc(r.snippet).replace(
            new RegExp(UI.esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'),
            '<mark>' + UI.esc(q) + '</mark>'
          );
          const factors = (r.factors || []).map(f => '<span class="badge D">' + UI.esc(f) + '</span>').join('');
          return '<div class="search-result" data-id="' + UI.esc(r.entry.id) + '">' +
            '<div class="date">' + UI.esc(r.entry.date) + '</div>' +
            '<div class="snippet">' + highlighted + '</div>' +
            (factors ? '<div class="factors">' + factors + '</div>' : '') +
          '</div>';
        }).join('');

      // 点击 → 关闭搜索 → 跳到数据库视图并定位条目
      resultsEl.querySelectorAll('.search-result').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          UI.modal.close();
          switchView('db');
          setTimeout(() => {
            // 高亮目标条目
            const row = document.querySelector('[data-entry-id="' + id + '"]');
            if (row){
              row.scrollIntoView({behavior:'smooth', block:'center'});
              row.style.transition = 'background 0.6s';
              row.style.background = 'oklch(94% 0.080 75)';
              setTimeout(() => { row.style.background = ''; }, 1500);
            }
          }, 200);
        });
      });
    }
    let searchTimer = null;
    input.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(doSearch, 150);
    });
    input.focus();
  }

  function showTestResults(){
    const results = runDomainTests();
    const passed = results.filter(r => r.pass).length;
    const failed = results.filter(r => !r.pass);
    let html = '<div style="margin-bottom:14px"><div style="font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-faint);margin-bottom:6px">Domain 层单元测试</div>';
    html += '<div style="display:flex;align-items:baseline;gap:12px"><span style="font-family:var(--serif);font-size:32px;font-weight:600;color:' + (passed === results.length ? 'var(--accent-deep)' : 'var(--warm)') + '">' + passed + '/' + results.length + '</span>';
    html += '<span style="color:var(--ink-faint);font-size:13px">通过率 ' + Math.round(passed / results.length * 100) + '%</span></div></div>';
    html += '<div style="display:grid;gap:6px;max-height:50vh;overflow-y:auto;margin:8px 0">';
    results.forEach(r => {
      html += '<div style="display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:8px 12px;background:var(--bg-soft);border-radius:8px;font-size:13px">';
      html += '<span style="font-family:var(--mono);font-size:14px;color:' + (r.pass ? 'var(--accent-deep)' : 'var(--warm)') + '">' + (r.pass ? '✓' : '✗') + '</span>';
      html += '<span><b style="color:var(--ink)">' + UI.esc(r.name) + '</b>';
      if (r.detail) html += '<div style="font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:2px">' + UI.esc(r.detail) + '</div>';
      html += '</span>';
      html += '<span style="font-family:var(--mono);font-size:10px;color:' + (r.pass ? 'var(--accent-deep)' : 'var(--warm)') + '">' + (r.pass ? 'PASS' : 'FAIL') + '</span>';
      html += '</div>';
    });
    html += '</div>';
    if (failed.length === 0){
      html += '<div class="inline-banner tip" style="margin-top:14px"><span>🎉</span><span><b>所有测试通过。</b>Domain 层算法稳定可靠。</span></div>';
    } else {
      html += '<div class="inline-banner warn" style="margin-top:14px"><span>⚠</span><span><b>' + failed.length + ' 项失败</b>，需要检查 Domain 层实现。</span></div>';
    }
    UI.modal.open('Domain 单元测试 · 运行结果', html, null);
    document.getElementById('modal-ok').style.display = 'none';
    setTimeout(() => document.getElementById('modal-ok').style.display = '', 0);
  }

  // 把测试入口暴露给命令面板
  if (typeof window !== 'undefined') window.TT_TEST = runDomainTests;

  return { init, runDomainTests, showTestResults };
})();

// 启动
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
